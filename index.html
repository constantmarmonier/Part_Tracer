<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PierreTrace — Parts Traceability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Modern greyscale — cool, neutral, slightly cool-tinted */
  --ink:#18181B;--ink2:#3F3F46;--ink3:#71717A;
  --paper:#F4F4F5;--paper2:#E4E4E7;--paper3:#D4D4D8;
  /* Orange accent retained */
  --accent:#D4580A;--accent-h:#B84808;
  --success:#3F7E48;--warn:#B8860B;--danger:#B83030;
  --r:6px;--rl:10px;
}
body{font-family:'Jost',sans-serif;background:var(--paper);color:var(--ink);font-size:14px;font-weight:400;letter-spacing:.005em}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;
  background:#18181B;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:100}
.logo{font-family:'Jost',sans-serif;font-size:15px;color:#F4F4F5;letter-spacing:.05em}
.logo span{color:var(--accent)}
.nav-tabs{display:flex;gap:4px}
.nav-tab{padding:6px 14px;border:none;border-radius:4px;background:transparent;color:#888;
  font-family:'Jost',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;letter-spacing:.03em}
.nav-tab:hover{background:#3F3F46;color:#E4E4E7}
.nav-tab.active{background:var(--accent);color:#fff}
.main{flex:1;padding:24px;max-width:1080px;margin:0 auto;width:100%}
h1{font-family:'Jost',sans-serif;font-size:22px;font-weight:700;margin-bottom:18px}
h3{font-family:'Jost',sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.card{background:#fff;border:1px solid var(--paper3);border-radius:var(--rl);padding:18px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--paper3);border-radius:var(--rl);padding:14px 16px}
.stat-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:5px}
.stat-n{font-family:'Jost',sans-serif;font-size:28px;font-weight:700;color:var(--ink);line-height:1}
.stat-s{font-size:11px;color:var(--ink3);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:var(--r);
  font-family:'Jost',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#B84808}
.btn-edit{background:#E8F0FD;color:#1A5A8A;border:1px solid #B5D4F4}.btn-edit:hover{background:#D4E8F8}
.btn-ghost{background:var(--paper2);color:var(--ink2);border:1px solid var(--paper3)}.btn-ghost:hover{background:var(--paper3)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:transparent;color:var(--danger);border:1px solid #f0c0c0}.btn-danger:hover{background:#fef0f0}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{padding:4px 8px;font-size:13px;min-width:28px;justify-content:center}
button:disabled{opacity:.35;cursor:not-allowed}
.input{width:100%;padding:7px 10px;border:1px solid var(--paper3);border-radius:var(--r);
  font-family:'Jost',sans-serif;font-size:13px;background:var(--paper);color:var(--ink);outline:none}
.input:focus{border-color:var(--accent);background:#fff}
.sel{width:100%;padding:7px 10px;border:1px solid var(--paper3);border-radius:var(--r);
  font-family:'Jost',sans-serif;font-size:13px;background:var(--paper);color:var(--ink);outline:none;cursor:pointer}
.sel:focus{border-color:var(--accent);background:#fff}
.label{display:block;font-size:11px;font-weight:500;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink3);margin-bottom:4px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field{flex:1;min-width:120px}
.dim-wrap{display:flex;align-items:center;gap:4px}
.dim-in{width:60px;padding:5px 6px;border:1px solid var(--paper3);border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;
  background:var(--paper);color:var(--ink);outline:none}
.dim-in:focus{border-color:var(--accent);background:#fff}
.dim-sep{font-size:11px;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:500;text-transform:uppercase;
  letter-spacing:.05em;color:var(--ink3);padding:8px 10px;background:var(--paper2);
  border-bottom:1px solid var(--paper3)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--paper2);font-size:13px;
  color:var(--ink2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FFFBF8}
.part-id{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent)}
.part-desc{font-size:11px;color:var(--ink3);margin-top:2px}
.mono{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-green{background:#D6EDDA;color:#2D6A35}
.badge-amber{background:#FDE9C0;color:#8A5F0A}
.badge-blue{background:#D4E8F8;color:#1A5A8A}
.badge-gray{background:var(--paper2);color:var(--ink3)}
.stage-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:20px;font-size:11px;font-weight:500;background:var(--paper2);color:var(--ink2)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.progress-wrap{width:80px;height:5px;background:var(--paper3);border-radius:3px;overflow:hidden}
.progress-fill{height:5px;background:var(--accent);border-radius:3px;transition:width .3s}
.toggle{width:36px;height:20px;background:var(--paper3);border-radius:10px;cursor:pointer;
  position:relative;transition:background .2s;flex-shrink:0;display:inline-block}
.toggle.on{background:var(--success)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;
  background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.toggle.on::after{transform:translateX(16px)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.empty{text-align:center;padding:40px;color:var(--ink3);font-size:13px}
.alert{padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:14px}
.alert-warn{background:#FDF3E3;border:1px solid #F0C040;color:#7A5A10}
.proj-row{border:1px solid var(--paper3);border-radius:var(--rl);background:#fff;margin-bottom:8px;overflow:hidden}
.proj-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer}
.proj-head:hover{background:#FFFBF8}
.proj-title{font-family:'Jost',sans-serif;font-weight:700;font-size:14px}
.proj-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.proj-body{padding:12px 16px 14px;border-top:1px solid var(--paper2)}
.edit-panel{background:var(--paper);border:1px solid var(--paper3);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ws-card{background:#fff;border:1px solid var(--paper3);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px}
.ws-id{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--accent)}
.ws-desc{font-size:13px;color:var(--ink2);margin-top:3px}
.ws-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.note-in{padding:6px 8px;border:1px solid var(--paper3);border-radius:4px;
  font-family:'Jost',sans-serif;font-size:12px;background:var(--paper);color:var(--ink);outline:none}
.note-in:focus{border-color:var(--accent);background:#fff}
.stage-li{display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:#fff;border:1px solid var(--paper3);border-radius:var(--r);margin-bottom:6px}
.stage-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink3);width:24px}
.color-swatch{width:24px;height:24px;border-radius:4px;border:1px solid var(--paper3);
  cursor:pointer;overflow:hidden;flex-shrink:0;position:relative}
.color-swatch input[type=color]{position:absolute;top:-4px;left:-4px;width:140%;height:140%;
  opacity:0;cursor:pointer;border:none;padding:0}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.err{font-size:12px;color:var(--danger);margin-top:6px}

/* ── Tablet & smartphone ────────────────────────────────────────────── */
@media(max-width:760px){
  /* Layout */
  .main{padding:14px 12px}
  .topbar{padding:10px 14px;gap:6px}
  .nav-tabs{width:100%;justify-content:stretch}
  .nav-tab{padding:8px 6px;font-size:12px;flex:1;text-align:center;letter-spacing:.02em}
  .logo{font-size:13px}

  /* Headings & cards */
  h1{font-size:18px;margin-bottom:14px}
  h3{font-size:12px}
  .card{padding:14px;margin-bottom:10px;border-radius:8px}
  .section-head{margin-bottom:10px}

  /* Stats — 2x2 grid, compact */
  .stats{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .stat{padding:10px 12px}
  .stat-l{font-size:10px}
  .stat-n{font-size:22px}
  .stat-s{font-size:10px}

  /* Stack all form rows vertically */
  .row{flex-direction:column;align-items:stretch;gap:8px}
  .row > .field{width:100%;min-width:0;max-width:none}
  /* keep dimension input row horizontal */
  .dim-wrap{flex-direction:row}

  /* Bigger touch targets */
  .btn{padding:10px 14px;font-size:13px;min-height:38px}
  .btn-sm{padding:7px 12px;font-size:12px;min-height:32px}
  .btn-icon{padding:8px 10px;min-width:36px;min-height:36px}

  /* Inputs — 16px prevents iOS auto-zoom */
  .input,.sel,.note-in{font-size:16px;padding:9px 11px}
  .dim-in{font-size:14px;width:54px;padding:7px 6px}
  .label{font-size:10px}

  /* Project list */
  .proj-head{padding:12px 14px}
  .proj-title{font-size:13px}
  .proj-sub{font-size:11px}
  .proj-body{padding:12px 14px 14px}
  .progress-wrap{width:64px}

  /* Smooth horizontal scroll for any wide tables */
  .tbl{-webkit-overflow-scrolling:touch}
  .tbl th,.tbl td{padding:8px 8px;font-size:12px}

  /* Stage / type list rows */
  .stage-li{padding:9px 10px;gap:6px;flex-wrap:wrap}
  .stage-num{width:auto;min-width:24px}

  /* Designer Part-ID column needs to fit on phone */
  .part-id{font-size:13px}

  /* Workshop cards */
  .ws-card{padding:14px 14px}
  .ws-id{font-size:15px !important}

  /* Filter bar wraps tightly */
  .filter-bar{gap:5px}
  .filter-bar .btn-sm{font-size:11px;padding:6px 10px;min-height:30px}

  /* Edit panel inside project body */
  .edit-panel{padding:12px;border-radius:6px}
  .edit-panel .row{margin-bottom:0}

  /* Subproject add form / migration prompt — they use inline div widths */
  .edit-panel > div[style*="row"] > *,
  .edit-panel .row > *{width:100% !important;max-width:none !important}

  /* Migration prompt input pair */
  .card div[style*="display:"][style*="gap:8"]{flex-wrap:wrap}

  /* Section header & project header wrap nicely on small screens */
  .section-head{flex-wrap:wrap;gap:8px}
  .section-head > *:first-child{flex:1;min-width:0}
  .proj-head{flex-wrap:wrap;gap:8px}
  .proj-head > *:first-child{flex:1;min-width:0;word-break:break-word}

  /* Color picker positioning - prevent overflow on small screens */
  .color-swatch{width:28px;height:28px}
}

/* ── Phone (narrow) ──────────────────────────────────────────────────── */
@media(max-width:420px){
  /* Even more compact */
  .main{padding:12px 10px}
  .stats{grid-template-columns:1fr;gap:6px;margin-bottom:12px}
  .stat-n{font-size:24px}
  h1{font-size:17px}
  .nav-tab{font-size:11px;padding:7px 4px;letter-spacing:0}
  .logo{font-size:12px}
  .progress-wrap{width:50px}
  /* Stack project header progress + arrow below name */
  .proj-head{flex-wrap:wrap}
  /* Smaller waffle tiles  */
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/occt-import-js.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ── defaults & helpers ────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 8);

const DEFAULT_STAGES = [
  { id:"st1", name:"Quarry block",    order:0, color:"#8B7355" },
  { id:"st2", name:"Slab cutting",    order:1, color:"#3A8BCC" },
  { id:"st3", name:"Cut piece",       order:2, color:"#2E86AB" },
  { id:"st4", name:"Rough machining", order:3, color:"#C4890A" },
  { id:"st5", name:"Hand finishing",  order:4, color:"#9B59B6" },
  { id:"st6", name:"Palletised",      order:5, color:"#3A7D44" },
];

const DEFAULT_PART_TYPES = [
  {name:"Tread",     code:"T"},
  {name:"Riser",     code:"R"},
  {name:"Landing",   code:"L"},
  {name:"Newel post",code:"NP"},
  {name:"Baluster",  code:"B"},
  {name:"Stringer",  code:"ST"},
  {name:"Other",     code:"X"},
];

const DEFAULT_MATERIALS = [
  {id:"mat-mol", name:"Moleanos",     density:2400}, // kg/m³
  {id:"mat-bb",  name:"Belgian Blue", density:2680},
];

function lsGet(k){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} }

// ── IndexedDB for STP files (too large for localStorage) ──────────────────────
const STP_DB_NAME = "pt:files";
const STP_STORE   = "stp";

function openStpDb(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(STP_DB_NAME, 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STP_STORE)) db.createObjectStore(STP_STORE);
    };
    req.onsuccess = e=>res(e.target.result);
    req.onerror   = ()=>rej(req.error);
  });
}
async function saveStpFile(partId, arrayBuffer){
  const db = await openStpDb();
  return new Promise((res, rej)=>{
    const tx = db.transaction(STP_STORE, "readwrite");
    tx.objectStore(STP_STORE).put(arrayBuffer, partId);
    tx.oncomplete = ()=>res();
    tx.onerror    = ()=>rej(tx.error);
  });
}
async function loadStpFile(partId){
  const db = await openStpDb();
  return new Promise((res, rej)=>{
    const tx = db.transaction(STP_STORE, "readonly");
    const req = tx.objectStore(STP_STORE).get(partId);
    req.onsuccess = ()=>res(req.result || null);
    req.onerror   = ()=>rej(req.error);
  });
}
async function deleteStpFile(partId){
  try{
    const db = await openStpDb();
    await new Promise((res, rej)=>{
      const tx = db.transaction(STP_STORE, "readwrite");
      tx.objectStore(STP_STORE).delete(partId);
      tx.oncomplete = ()=>res();
      tx.onerror    = ()=>rej(tx.error);
    });
  }catch{} // best-effort
}

function stageColor(stage){ return stage?.color || "#8B7355"; }

function getPartId(part, projects, subprojects=[]){
  const proj = projects.find(p => p.id===part.projectId);
  const sub  = part.subprojectId ? subprojects.find(s => s.id===part.subprojectId) : null;
  const projCode = proj?.projectCode || "????";
  const subSeg   = sub ? `-${sub.subCode}` : "";
  return `${projCode}${subSeg}-${part.suffix||"???"}${part.typeCode||""}`;
}

// Weight (kg) = L(mm) × W(mm) × H(mm) × density(kg/m³) / 1e9
function getPartWeight(part, materials){
  if(!part || !part.materialId) return null;
  const L = parseFloat(part.length), W = parseFloat(part.width), H = parseFloat(part.height);
  if(!L || !W || !H || isNaN(L)||isNaN(W)||isNaN(H)) return null;
  const mat = materials.find(m=>m.id===part.materialId);
  if(!mat || !mat.density) return null;
  return (L * W * H * mat.density) / 1e9;
}

function formatWeight(kg){
  if(kg===null || kg===undefined || isNaN(kg)) return null;
  if(kg < 1)    return `${Math.round(kg*1000)} g`;
  if(kg < 100)  return `${kg.toFixed(1)} kg`;
  return `${Math.round(kg)} kg`;
}

function materialName(materialId, materials){
  return materials.find(m=>m.id===materialId)?.name || null;
}

// ── SMC marker system: vector ID replacing QR codes ──────────────────────────
// Triangle geometry from smc_logo.dxf (y flipped: DXF y-up → SVG y-down).
// 3 triangles: center upright, right downside, left downside.
// Each triangle has vertices A,B,C and trisection points D,E (on AB), F,G (on BC), H,I (on CA).
const SMC_TRIANGLES = [
  // Center upright (apex up)
  { A:[ 3.1908, 0], B:[ 0,    -6.2394], C:[-3.1908, 0] },
  // Right downside (apex down)
  { A:[12.2088, 0], B:[ 6.2254, 5.9342], C:[ 3.1908, 0] },
  // Left downside (apex down)
  { A:[-12.2088,0], B:[-6.2254, 5.9342], C:[-3.1908, 0] },
];
const SMC_BASELINE = [ [[-15,0],[-12.2088,0]], [[12.2088,0],[15,0]] ];

// 18 allowed interior line positions per triangle (user-confirmed: ih → eh).
const MARKER_LINES = ["ag","af","bh","bi","cd","ce","df","dg","di","dh","ie","eh","ef","eg","fi","fh","gh","gi"];

// Pre-enumerate all 988 valid subsets (size 0/1/2/3) in canonical lex order.
const MARKER_SUBSETS = (() => {
  const subs = [[]];
  const N = MARKER_LINES.length; // 18
  for (let i = 0; i < N; i++) subs.push([i]);
  for (let i = 0; i < N; i++) for (let j = i+1; j < N; j++) subs.push([i, j]);
  for (let i = 0; i < N; i++) for (let j = i+1; j < N; j++) for (let k = j+1; k < N; k++) subs.push([i, j, k]);
  return subs;
})();
const MARKER_STATES_PER_TRI = MARKER_SUBSETS.length;   // 988
const MARKER_TOTAL          = MARKER_STATES_PER_TRI ** 3; // 964,430,272
// Bijective scramble so consecutive part numbers produce visually distinct markers.
const MARKER_SCRAMBLE_P = 982451653; // prime, coprime to 988^3
// Crockford base-32 (no I, L, O, U) for human-typable codes.
const MARKER_ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

function markerSeqToCode(seq){
  // Scramble first, then base-32 encode to 6 chars (~30 bits).
  let n = (seq * MARKER_SCRAMBLE_P) % MARKER_TOTAL;
  // safety: bring back to integer range
  n = Math.abs(Math.round(n));
  if(n >= MARKER_TOTAL) n = n % MARKER_TOTAL;
  let s = "";
  for(let i = 0; i < 6; i++){ s = MARKER_ALPHABET[n & 31] + s; n = Math.floor(n / 32); }
  return s;
}
function markerCodeToInt(code){
  if(!code) return -1;
  const c = code.toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(c.length !== 6) return -1;
  let n = 0;
  for(const ch of c){
    const v = MARKER_ALPHABET.indexOf(ch);
    if(v < 0) return -1;
    n = n * 32 + v;
  }
  return n;
}
function markerCodeToStates(code){
  // Returns [s1, s2, s3] each in [0, 988), or null on error.
  const n = markerCodeToInt(code);
  if(n < 0) return null;
  // Limit to total space (codes that map outside MARKER_TOTAL are still legal, just modulo'd)
  let x = n % MARKER_TOTAL;
  const s3 = x % MARKER_STATES_PER_TRI; x = Math.floor(x / MARKER_STATES_PER_TRI);
  const s2 = x % MARKER_STATES_PER_TRI; x = Math.floor(x / MARKER_STATES_PER_TRI);
  const s1 = x % MARKER_STATES_PER_TRI;
  return [s1, s2, s3];
}
function lerp(p, q, t){ return [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t]; }
function trianglePoints(tri){
  const {A,B,C} = tri;
  return {
    A, B, C,
    D: lerp(A, B, 1/3), E: lerp(A, B, 2/3),
    F: lerp(B, C, 1/3), G: lerp(B, C, 2/3),
    H: lerp(C, A, 1/3), I: lerp(C, A, 2/3),
  };
}

// MarkerSVG — vector replacement for QR. Same-thickness lines; pure vector.
// strokePx (optional): when provided, computes a stroke-width such that the
// rendered strokes are *approximately* this many CSS pixels at the current size.
// Otherwise falls back to strokeRatio × viewBox-width (relative to vector units).
function MarkerSVG({ code, size=80, strokeRatio=0.045, strokePx=null, color="#18181B" }){
  if(!code) return null;
  const states = markerCodeToStates(code);
  if(!states) return null;
  const VB_X=-16.5, VB_Y=-7.2, VB_W=33, VB_H=14.4;
  const sw = (strokePx !== null && strokePx !== undefined)
    ? strokePx * (VB_W / size)        // px → viewBox units at the rendered size
    : VB_W * strokeRatio;

  const triPaths = SMC_TRIANGLES.map((tri,i)=>{
    const pts = trianglePoints(tri);
    const subset = MARKER_SUBSETS[states[i]] || [];
    return {
      outline: `M ${tri.A[0]} ${tri.A[1]} L ${tri.B[0]} ${tri.B[1]} L ${tri.C[0]} ${tri.C[1]} Z`,
      interior: subset.map(idx=>{
        const ln = MARKER_LINES[idx];
        const p1 = pts[ln[0].toUpperCase()];
        const p2 = pts[ln[1].toUpperCase()];
        return { p1, p2 };
      }),
    };
  });

  return (
    <svg viewBox={`${VB_X} ${VB_Y} ${VB_W} ${VB_H}`}
      width={size} height={size * VB_H / VB_W}
      xmlns="http://www.w3.org/2000/svg"
      style={{display:"block"}}>
      <g fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
        {/* Baseline-extension segments */}
        {SMC_BASELINE.map(([a,b],i)=>(
          <line key={"bl"+i} x1={a[0]} y1={a[1]} x2={b[0]} y2={b[1]} />
        ))}
        {/* 3 triangles */}
        {triPaths.map((t,i)=>(
          <g key={"t"+i}>
            <path d={t.outline} />
            {t.interior.map((l,j)=>(
              <line key={j} x1={l.p1[0]} y1={l.p1[1]} x2={l.p2[0]} y2={l.p2[1]} />
            ))}
          </g>
        ))}
      </g>
    </svg>
  );
}

// Build a downloadable SVG string from a marker code and trigger browser download.
function downloadMarkerSVG(code, partLabel){
  if(!code) return;
  const states = markerCodeToStates(code);
  if(!states) return;
  const VB_X=-16.5, VB_Y=-7.2, VB_W=33, VB_H=14.4;
  const sw = VB_W * 0.045;
  let body = "";
  // baseline
  for(const [a,b] of SMC_BASELINE){
    body += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
  }
  // triangles + interior lines
  SMC_TRIANGLES.forEach((tri,i)=>{
    body += `<path d="M ${tri.A[0]} ${tri.A[1]} L ${tri.B[0]} ${tri.B[1]} L ${tri.C[0]} ${tri.C[1]} Z"/>`;
    const pts = trianglePoints(tri);
    const subset = MARKER_SUBSETS[states[i]] || [];
    for(const idx of subset){
      const ln = MARKER_LINES[idx];
      const p1 = pts[ln[0].toUpperCase()];
      const p2 = pts[ln[1].toUpperCase()];
      body += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`;
    }
  });
  const safeLabel = (partLabel||"part").replace(/[^a-zA-Z0-9_-]/g,"_");
  const svgContent =
    `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n` +
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${VB_X} ${VB_Y} ${VB_W} ${VB_H}" width="200mm" height="${(200*VB_H/VB_W).toFixed(2)}mm">\n` +
    `  <title>SMC marker ${code} — ${partLabel||""}</title>\n` +
    `  <g fill="none" stroke="#000000" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">\n` +
    `    ${body}\n` +
    `  </g>\n` +
    `</svg>\n`;
  const blob = new Blob([svgContent], {type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `marker-${code}-${safeLabel}.svg`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// MarkerSearch — manual code entry modal (replaces camera scanner).
function MarkerSearch({ onFound, onClose }){
  const [code, setCode]   = useState("");
  const [error, setError] = useState("");
  const inputRef = React.useRef(null);

  useEffect(()=>{ inputRef.current?.focus(); },[]);

  function submit(){
    const c = code.trim().toUpperCase().replace(/[^0-9A-Z]/g,"");
    if(c.length !== 6){ setError("Code must be exactly 6 characters (numbers + letters)."); return; }
    setError("");
    onFound(c);
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:3000,
      display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:"#fff",borderRadius:12,padding:22,width:"min(94vw,420px)",
        boxShadow:"0 12px 40px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <span style={{fontSize:22}}>△</span>
          <h3 style={{margin:0,fontSize:14,letterSpacing:".04em"}}>Find part by marker code</h3>
        </div>
        <p style={{fontSize:12,color:"var(--ink3)",lineHeight:1.55,marginBottom:14}}>
          Enter the 6-character code printed on the part's physical template. Letters and numbers — uppercase only, no I / L / O / U.
        </p>
        <input ref={inputRef} className="input" value={code}
          placeholder="K3F2A9"
          maxLength={8}
          style={{fontFamily:"'JetBrains Mono',monospace",fontSize:22,fontWeight:700,
            textAlign:"center",letterSpacing:".15em",color:"var(--accent)"}}
          onChange={e=>{ setError(""); setCode(e.target.value.toUpperCase()); }}
          onKeyDown={e=>{ if(e.key==="Enter") submit(); }} />
        {error && <div className="err" style={{marginTop:8}}>⚠ {error}</div>}

        {code.trim().length===6 && !error && (
          <div style={{marginTop:14,padding:14,background:"var(--paper)",borderRadius:8,
            border:"1px solid var(--paper3)",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <MarkerSVG code={code.trim().toUpperCase()} size={180} />
          </div>
        )}

        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:16}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={submit}>Find part</button>
        </div>
      </div>
    </div>
  );
}

// ── Waffle chart for Manager parts overview ──────────────────────────────────
function WaffleChart({ parts:rawParts, stages, projects, subprojects, materials }){
  const [hovered, setHovered] = useState(null);
  const [pinned,  setPinned]  = useState(null);
  const wrapRef = React.useRef(null);

  const sorted = [...stages].sort((a,b)=>a.order-b.order);
  const lastId = sorted[sorted.length-1]?.id;

  // sort: on-hold first → not started → through stages → finished last
  const sortedParts = [...rawParts].sort((a,b)=>{
    const aHold = !a.okToManufacture, bHold = !b.okToManufacture;
    if(aHold !== bHold) return aHold ? -1 : 1;
    const aIdx = a.stageId ? sorted.findIndex(s=>s.id===a.stageId) : -1;
    const bIdx = b.stageId ? sorted.findIndex(s=>s.id===b.stageId) : -1;
    return aIdx - bIdx;
  });

  function tileColor(part){
    if(!part.okToManufacture) return "#BDBDBD";
    if(!part.stageId)         return "#E0E0E0";
    const s = sorted.find(st=>st.id===part.stageId);
    return s ? stageColor(s) : "#E0E0E0";
  }
  function partStatus(part){
    if(!part.okToManufacture) return {label:"On hold", color:"#BDBDBD"};
    if(!part.stageId)         return {label:"Not started", color:"#9E9E9E"};
    const s = sorted.find(st=>st.id===part.stageId);
    if(!s) return {label:"Unknown", color:"#9E9E9E"};
    return {label: part.stageId===lastId ? `${s.name} (finished)` : s.name, color: stageColor(s)};
  }

  // close pinned when clicking outside
  useEffect(()=>{
    if(!pinned) return;
    const close = e=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setPinned(null); };
    document.addEventListener("mousedown", close);
    return ()=>document.removeEventListener("mousedown", close);
  },[pinned]);

  if(sortedParts.length===0){
    return <div style={{fontSize:12,color:"var(--ink3)",padding:"8px 0"}}>No parts yet — add them in the Designer page.</div>;
  }

  const shown = pinned || hovered;
  const status = shown ? partStatus(shown) : null;

  // counts for legend
  const cntHold = sortedParts.filter(p=>!p.okToManufacture).length;
  const cntNone = sortedParts.filter(p=>p.okToManufacture && !p.stageId).length;
  const stageCounts = sorted.map(s=>({stage:s, count:sortedParts.filter(p=>p.okToManufacture && p.stageId===s.id).length}));

  return (
    <div ref={wrapRef} style={{padding:"6px 0"}}>
      {/* Waffle row */}
      <div style={{display:"flex",gap:3,overflowX:"auto",padding:"6px 2px",alignItems:"center"}}>
        {sortedParts.map(part=>{
          const isPinned  = pinned?.id  === part.id;
          const isHovered = hovered?.id === part.id;
          return (
            <div key={part.id}
              onMouseEnter={()=>setHovered(part)}
              onMouseLeave={()=>setHovered(null)}
              onClick={e=>{ e.stopPropagation(); setPinned(p => p?.id===part.id ? null : part); }}
              style={{
                width:22, height:22, borderRadius:3, flexShrink:0,
                background: tileColor(part),
                cursor:"pointer",
                border: isPinned ? "2px solid var(--ink)" : "1px solid rgba(0,0,0,.12)",
                outline: isHovered && !isPinned ? "2px solid var(--accent)" : "none",
                outlineOffset: 1,
                transition:"outline .12s",
              }}
            />
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:14,marginTop:8,fontSize:11,color:"var(--ink3)",flexWrap:"wrap",alignItems:"center"}}>
        {cntHold>0 && (
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{width:10,height:10,borderRadius:2,background:"#BDBDBD"}}></span>
            On hold · {cntHold}
          </div>
        )}
        {cntNone>0 && (
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{width:10,height:10,borderRadius:2,background:"#E0E0E0",border:"1px solid #ccc"}}></span>
            Not started · {cntNone}
          </div>
        )}
        {stageCounts.filter(sc=>sc.count>0).map(sc=>(
          <div key={sc.stage.id} style={{display:"flex",alignItems:"center",gap:5}}>
            <span style={{width:10,height:10,borderRadius:2,background:stageColor(sc.stage)}}></span>
            {sc.stage.name} · {sc.count}
          </div>
        ))}
      </div>

      {/* Detail card — hover or pinned */}
      {shown && (
        <div style={{
          marginTop:12, padding:"12px 14px",
          background:"#fff", border:"1px solid var(--paper3)", borderRadius:8,
          boxShadow: pinned ? "0 2px 12px rgba(0,0,0,.08)" : "none",
          transition:"box-shadow .15s",
        }}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8,gap:10,flexWrap:"wrap"}}>
            <div style={{flex:1,minWidth:180}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:2}}>
                <span className="part-id" style={{fontSize:14}}>{getPartId(shown, projects, subprojects)}</span>
                {pinned && <span style={{fontSize:10,color:"var(--ink3)",fontStyle:"italic"}}>📌 pinned</span>}
              </div>
              {shown.description && <div style={{fontSize:12,color:"var(--ink2)"}}>{shown.description}</div>}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              {!shown.okToManufacture
                ? <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,
                    fontSize:11,fontWeight:600,background:"#F0EDE6",color:"var(--ink3)",border:"1px solid var(--paper3)"}}>
                    ⏸ On hold
                  </span>
                : <span className="stage-pill">
                    <span className="dot" style={{background:status.color}} />
                    {status.label}
                  </span>}
              {pinned && <button className="btn btn-ghost btn-sm" onClick={()=>setPinned(null)} style={{padding:"3px 8px"}}>✕</button>}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:"6px 18px",fontSize:12,color:"var(--ink3)"}}>
            <div><strong style={{color:"var(--ink2)"}}>Type:</strong> {shown.type || "—"}</div>
            <div><strong style={{color:"var(--ink2)"}}>Dimensions:</strong> {(shown.length||shown.width||shown.height) ? <span style={{fontFamily:"'JetBrains Mono',monospace"}}>{`${shown.length||"—"} × ${shown.width||"—"} × ${shown.height||"—"} mm`}</span> : "—"}</div>
            {(() => {
              const w = getPartWeight(shown, materials);
              return <div><strong style={{color:"var(--ink2)"}}>Weight:</strong> {w!==null ? <span style={{fontFamily:"'JetBrains Mono',monospace",color:"var(--accent)",fontWeight:600}}>{formatWeight(w)}</span> : "—"}</div>;
            })()}
            <div><strong style={{color:"var(--ink2)"}}>Material:</strong> {materialName(shown.materialId, materials) || "—"}</div>
            <div><strong style={{color:"var(--ink2)"}}>OK to make:</strong> {shown.okToManufacture ? "Yes" : "No"}</div>
            <div style={{gridColumn:"1/-1"}}><strong style={{color:"var(--ink2)"}}>Notes:</strong> {shown.notes || "—"}</div>
          </div>
        </div>
      )}

      {/* placeholder when nothing selected so layout doesn't jump */}
      {!shown && (
        <div style={{marginTop:12,padding:"8px 12px",fontSize:11,color:"var(--ink3)",fontStyle:"italic",textAlign:"center"}}>
          Hover a tile to preview, click to pin
        </div>
      )}
    </div>
  );
}

// ── Manager ───────────────────────────────────────────────────────────────────
function ManagerPage({ stages, projects, setProjects, subprojects, setSubprojects, parts, setParts, materials }){
  const [showAdd,   setShowAdd]   = useState(false);
  const [addForm,   setAddForm]   = useState({ name:"", projectCode:"", client:"", materialId:"" });
  const [addErr,    setAddErr]    = useState("");
  const [open,      setOpen]      = useState(null);          // open project id
  const [openSub,   setOpenSub]   = useState(null);          // open subproject id
  const [editId,    setEditId]    = useState(null);
  const [editForm,  setEditForm]  = useState({ name:"", projectCode:"", client:"", materialId:"" });
  const [editErr,   setEditErr]   = useState("");
  const [confirmId, setConfirmId] = useState(null);
  // subproject add/edit
  const [addingSubForProj, setAddingSubForProj] = useState(null);
  const [subAddForm, setSubAddForm] = useState({ name:"", subCode:"" });
  const [subAddErr,  setSubAddErr]  = useState("");
  const [editSubId,  setEditSubId]  = useState(null);
  const [editSubForm,setEditSubForm]= useState({ name:"", subCode:"" });
  const [editSubErr, setEditSubErr] = useState("");
  const [confirmSubId,setConfirmSubId] = useState(null);
  // migration prompt state
  const [migrate, setMigrate] = useState(null);  // {projectId, newSub:{name,subCode}, keepNew:{name,subCode}}

  const sorted = [...stages].sort((a,b)=>a.order-b.order);
  const lastId = sorted[sorted.length-1]?.id;
  const okCount= parts.filter(p=>p.okToManufacture).length;
  const done   = parts.filter(p=>p.stageId===lastId).length;

  function addProject(){
    if(!addForm.name.trim()) return;
    const code = addForm.projectCode.trim().toUpperCase();
    if(!code){ setAddErr("Project ID is required."); return; }
    if(projects.some(p=>p.projectCode===code)){ setAddErr(`"${code}" is already used.`); return; }
    setAddErr("");
    setProjects(prev=>[...prev,{id:uid(),name:addForm.name.trim(),projectCode:code,client:addForm.client.trim(),materialId:addForm.materialId||null,createdAt:new Date().toISOString()}]);
    setAddForm({name:"",projectCode:"",client:"",materialId:""});
    setShowAdd(false);
  }

  function startEdit(proj){
    setEditId(proj.id);
    setEditForm({name:proj.name,projectCode:proj.projectCode||"",client:proj.client||"",materialId:proj.materialId||""});
    setEditErr(""); setConfirmId(null);
  }
  function saveEdit(){
    if(!editForm.name.trim()) return;
    const code = editForm.projectCode.trim().toUpperCase();
    if(!code){ setEditErr("Project ID is required."); return; }
    if(projects.some(p=>p.projectCode===code && p.id!==editId)){ setEditErr(`"${code}" is already used.`); return; }
    setEditErr("");
    setProjects(prev=>prev.map(p=>p.id===editId?{...p,name:editForm.name.trim(),projectCode:code,client:editForm.client.trim(),materialId:editForm.materialId||null}:p));
    setEditId(null);
  }
  function deleteProject(id){
    setProjects(prev=>prev.filter(p=>p.id!==id));
    setSubprojects(prev=>prev.filter(s=>s.projectId!==id));
    setParts(prev=>prev.filter(p=>p.projectId!==id));
    setConfirmId(null); setOpen(null); setEditId(null);
  }

  // ── Subprojects ──
  function projSubs(projId){ return subprojects.filter(s=>s.projectId===projId); }
  function projDirectParts(projId){ return parts.filter(p=>p.projectId===projId && !p.subprojectId && !p.deletedByDesigner); }
  function subParts(subId){ return parts.filter(p=>p.subprojectId===subId && !p.deletedByDesigner); }
  function allProjParts(projId){ return parts.filter(p=>p.projectId===projId && !p.deletedByDesigner); }

  // progress is computed over ALL parts in scope (direct + all subprojects)
  function projPct(projId){
    const list=allProjParts(projId);
    if(!list.length) return 0;
    return Math.round(list.filter(p=>p.stageId===lastId).length/list.length*100);
  }
  function subPct(subId){
    const list=subParts(subId);
    if(!list.length) return 0;
    return Math.round(list.filter(p=>p.stageId===lastId).length/list.length*100);
  }

  function startAddSub(projId){
    setAddingSubForProj(projId);
    setSubAddForm({name:"",subCode:""}); setSubAddErr("");
  }
  function cancelAddSub(){ setAddingSubForProj(null); setSubAddErr(""); }

  function submitAddSub(projId){
    const name=subAddForm.name.trim();
    const code=subAddForm.subCode.trim().toUpperCase();
    if(!name||!code){ setSubAddErr("Both name and ID are required."); return; }
    if(subprojects.some(s=>s.projectId===projId && s.subCode===code)){
      setSubAddErr(`"${code}" already exists in this project.`); return;
    }
    const direct = projDirectParts(projId);
    if(direct.length > 0){
      // first subproject AND project has direct parts → trigger migration prompt
      setMigrate({ projectId:projId, newSub:{name,subCode:code}, keepNewName:"", keepNewCode:"", error:"" });
      setSubAddErr("");
      return;
    }
    // straight create
    const newSubId = uid();
    setSubprojects(prev=>[...prev,{id:newSubId, projectId:projId, name, subCode:code, createdAt:new Date().toISOString()}]);
    setAddingSubForProj(null);
    setSubAddForm({name:"",subCode:""});
    setOpenSub(newSubId);
  }

  // migration handlers
  function migrateMoveToNew(){
    const m = migrate;
    const newSubId = uid();
    setSubprojects(prev=>[...prev,{id:newSubId, projectId:m.projectId, name:m.newSub.name, subCode:m.newSub.subCode, createdAt:new Date().toISOString()}]);
    setParts(prev=>prev.map(p=>(p.projectId===m.projectId && !p.subprojectId)?{...p,subprojectId:newSubId}:p));
    setMigrate(null); setAddingSubForProj(null); setSubAddForm({name:"",subCode:""});
    setOpenSub(newSubId);
  }
  function migrateMoveToSeparate(){
    const m = migrate;
    const keepName=m.keepNewName.trim();
    const keepCode=m.keepNewCode.trim().toUpperCase();
    if(!keepName||!keepCode){ setMigrate(m2=>({...m2,error:"Enter a name and ID for the existing-parts subproject."})); return; }
    if(keepCode===m.newSub.subCode){ setMigrate(m2=>({...m2,error:"The two subproject IDs must be different."})); return; }
    if(subprojects.some(s=>s.projectId===m.projectId && (s.subCode===keepCode||s.subCode===m.newSub.subCode))){
      setMigrate(m2=>({...m2,error:"One of the IDs is already used."})); return;
    }
    const newSubId = uid();
    const keepSubId = uid();
    setSubprojects(prev=>[
      ...prev,
      {id:newSubId,  projectId:m.projectId, name:m.newSub.name, subCode:m.newSub.subCode, createdAt:new Date().toISOString()},
      {id:keepSubId, projectId:m.projectId, name:keepName,      subCode:keepCode,         createdAt:new Date().toISOString()},
    ]);
    setParts(prev=>prev.map(p=>(p.projectId===m.projectId && !p.subprojectId)?{...p,subprojectId:keepSubId}:p));
    setMigrate(null); setAddingSubForProj(null); setSubAddForm({name:"",subCode:""});
    setOpenSub(newSubId);
  }

  function startEditSub(s){
    setEditSubId(s.id);
    setEditSubForm({name:s.name,subCode:s.subCode||""});
    setEditSubErr(""); setConfirmSubId(null);
  }
  function saveEditSub(){
    const name=editSubForm.name.trim();
    const code=editSubForm.subCode.trim().toUpperCase();
    if(!name||!code){ setEditSubErr("Both name and ID are required."); return; }
    const orig = subprojects.find(s=>s.id===editSubId);
    if(subprojects.some(s=>s.projectId===orig.projectId && s.subCode===code && s.id!==editSubId)){
      setEditSubErr(`"${code}" already exists in this project.`); return;
    }
    setSubprojects(prev=>prev.map(s=>s.id===editSubId?{...s,name,subCode:code}:s));
    setEditSubId(null);
  }
  function deleteSub(id){
    setSubprojects(prev=>prev.filter(s=>s.id!==id));
    setParts(prev=>prev.filter(p=>p.subprojectId!==id));
    setConfirmSubId(null); setOpenSub(null); setEditSubId(null);
  }

  // ── render helpers ──
  function renderPartsTable(list){
    return <WaffleChart parts={list} stages={stages} projects={projects} subprojects={subprojects} materials={materials} />;
  }

  return (
    <div>
      <div className="stats">
        <div className="stat"><div className="stat-l">Projects</div><div className="stat-n">{projects.length}</div></div>
        <div className="stat"><div className="stat-l">Subprojects</div><div className="stat-n">{subprojects.length}</div></div>
        <div className="stat"><div className="stat-l">Total parts</div><div className="stat-n">{parts.length}</div></div>
        <div className="stat"><div className="stat-l">Completed</div><div className="stat-n">{done}</div><div className="stat-s">reached final stage</div></div>
      </div>

      <div className="section-head">
        <h1>Projects</h1>
        <button className="btn btn-primary" onClick={()=>setShowAdd(v=>!v)}>+ New project</button>
      </div>

      {showAdd && (
        <div className="card">
          <h3>New project</h3>
          <div className="row">
            <div className="field"><label className="label">Project name</label>
              <input className="input" placeholder="e.g. Grand House" value={addForm.name}
                onChange={e=>setAddForm(f=>({...f,name:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addProject()} /></div>
            <div className="field" style={{maxWidth:120}}><label className="label">Project ID *</label>
              <input className="input" placeholder="e.g. GH" value={addForm.projectCode}
                onChange={e=>{setAddErr("");setAddForm(f=>({...f,projectCode:e.target.value.toUpperCase()}));}}
                style={{fontFamily:"'JetBrains Mono',monospace"}} onKeyDown={e=>e.key==="Enter"&&addProject()} /></div>
            <div className="field"><label className="label">Client</label>
              <input className="input" placeholder="e.g. Dupont family" value={addForm.client}
                onChange={e=>setAddForm(f=>({...f,client:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addProject()} /></div>
            <div className="field" style={{maxWidth:200}}><label className="label">Default material</label>
              <select className="sel" value={addForm.materialId}
                onChange={e=>setAddForm(f=>({...f,materialId:e.target.value}))}>
                <option value="">— none —</option>
                {materials.map(m=><option key={m.id} value={m.id}>{m.name} ({m.density} kg/m³)</option>)}
              </select></div>
            <button className="btn btn-primary" onClick={addProject}>Create</button>
            <button className="btn btn-ghost" onClick={()=>{setShowAdd(false);setAddErr("");}}>Cancel</button>
          </div>
          {addErr && <div className="err">⚠ {addErr}</div>}
        </div>
      )}

      {projects.length===0 && !showAdd && <div className="empty">No projects yet — create your first one above.</div>}

      {/* ── Migration prompt modal ── */}
      {migrate && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:2500,
          display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:12,padding:22,maxWidth:520,width:"100%",
            boxShadow:"0 10px 40px rgba(0,0,0,.25)"}}>
            <h3 style={{marginBottom:10}}>Where should existing parts go?</h3>
            <p style={{fontSize:13,color:"var(--ink2)",lineHeight:1.6,marginBottom:16}}>
              This project has <strong>{projDirectParts(migrate.projectId).length} part{projDirectParts(migrate.projectId).length!==1?"s":""}</strong> directly attached.
              Once you create a subproject, parts can only live inside subprojects. Choose one option:
            </p>

            <div style={{padding:12,background:"var(--paper)",borderRadius:8,marginBottom:10,border:"1px solid var(--paper3)"}}>
              <div style={{fontWeight:500,fontSize:13,marginBottom:4}}>Option 1 — Move all existing parts into the new subproject</div>
              <div style={{fontSize:11,color:"var(--ink3)",marginBottom:10}}>
                Existing parts join "<strong>{migrate.newSub.name}</strong>" [<span style={{fontFamily:"'JetBrains Mono',monospace"}}>{migrate.newSub.subCode}</span>]
              </div>
              <button className="btn btn-primary btn-sm" onClick={migrateMoveToNew}>Move to {migrate.newSub.subCode}</button>

            <div style={{padding:12,background:"var(--paper)",borderRadius:8,border:"1px solid var(--paper3)"}}>

              <div style={{display:"flex",gap:8,marginBottom:8}}>

                      <div className="field"><label className="label">Project name</label>
                        <input className="input" value={editForm.name}

                      <div className="field" style={{maxWidth:120}}><label className="label">Project ID</label>
                        <input className="input" value={editForm.projectCode}

                      <div className="field"><label className="label">Client</label>

                          onChange={e=>setEditForm(f=>({...f,materialId:e.target.value}))}>

                      const list  = subParts(s.id);

                      const isOp  = openSub===s.id;
                      const isEdS = editSubId===s.id;
                      return (
                        <div key={s.id} style={{marginBottom:8,marginLeft:18,borderLeft:"3px solid var(--paper3)",paddingLeft:14}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",padding:"10px 12px",

                            onClick={()=>{ if(!isEdS) setOpenSub(isOp?null:s.id); }}>
                            <div>
                              <div style={{fontFamily:"'Jost',sans-serif",fontWeight:700,fontSize:13}}>
                                ↳ {s.name}
                                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"var(--accent)",marginLeft:8,fontWeight:400}}>[{proj.projectCode}-{s.subCode}]</span>
                              </div>
                              <div style={{fontSize:11,color:"var(--ink3)",marginTop:2}}>
                                {list.length} part{list.length!==1?"s":""} · created {new Date(s.createdAt).toLocaleDateString("en-GB")}

                            </div>
                            <div style={{display:"flex",alignItems:"center",gap:12}}>
                              <div>
                                <div style={{fontSize:11,color:"var(--ink3)",marginBottom:3,textAlign:"right"}}>{sp}%</div>

                              {isEdS && (
                                <div className="edit-panel" style={{marginBottom:10}}>

                                  <div className="row">

                                        onChange={e=>setEditSubForm(f=>({...f,name:e.target.value}))} /></div>
                                    <div style={{width:120}}><label className="label">Subproject ID</label>
                                      <input className="input" value={editSubForm.subCode}
                                        onChange={e=>{setEditSubErr("");setEditSubForm(f=>({...f,subCode:e.target.value.toUpperCase()}));}}
                                        style={{fontFamily:"'JetBrains Mono',monospace"}} /></div>
                                    <button className="btn btn-success btn-sm" onClick={saveEditSub}>Save</button>
                                    <button className="btn btn-ghost btn-sm" onClick={()=>setEditSubId(null)}>Cancel</button>
                                  </div>
                                  {editSubErr && <div className="err">⚠ {editSubErr}</div>}
                                </div>
                              )}
                              {renderPartsTable(list)}
                              <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:8}}>
                                {confirmSubId===s.id ? (
                                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                                    <span style={{fontSize:12,color:"var(--danger)"}}>Delete this subproject and its parts?</span>
                                    <button className="btn btn-danger btn-sm" onClick={()=>deleteSub(s.id)}>Yes, delete</button>
                                    <button className="btn btn-ghost btn-sm" onClick={()=>setConfirmSubId(null)}>Cancel</button>
                                  </div>
                                ) : (
                                  <>
                                    {!isEdS && <button className="btn btn-edit btn-sm" onClick={e=>{e.stopPropagation();startEditSub(s);}}>✏ Edit subproject</button>}
                                    <button className="btn btn-danger btn-sm" onClick={()=>setConfirmSubId(s.id)}>Delete subproject</button>
                                  </>
                                )}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Add-subproject form */}
                {addingSubForProj===proj.id ? (
                  <div className="edit-panel" style={{marginTop:12}}>
                    <h3 style={{marginBottom:10}}>New subproject in {proj.name}</h3>
                    <div className="row">
                      <div className="field"><label className="label">Subproject name</label>
                        <input className="input" placeholder="e.g. Block 2" value={subAddForm.name}
                          onChange={e=>setSubAddForm(f=>({...f,name:e.target.value}))}
                          onKeyDown={e=>e.key==="Enter"&&submitAddSub(proj.id)} /></div>
                      <div style={{width:120}}><label className="label">Subproject ID *</label>
                        <input className="input" placeholder="e.g. B2" value={subAddForm.subCode}
                          onChange={e=>{setSubAddErr("");setSubAddForm(f=>({...f,subCode:e.target.value.toUpperCase()}));}}
                          style={{fontFamily:"'JetBrains Mono',monospace"}}
                          onKeyDown={e=>e.key==="Enter"&&submitAddSub(proj.id)} /></div>
                      <button className="btn btn-primary btn-sm" onClick={()=>submitAddSub(proj.id)}>Create</button>
                      <button className="btn btn-ghost btn-sm" onClick={cancelAddSub}>Cancel</button>
                    </div>
                    {subAddErr && <div className="err">⚠ {subAddErr}</div>}
                    <div style={{fontSize:11,color:"var(--ink3)",marginTop:6}}>
                      Part IDs will become <span style={{fontFamily:"'JetBrains Mono',monospace"}}>{proj.projectCode}-{subAddForm.subCode||"??"}-3ST</span>
                    </div>
                  </div>
                ) : (
                  <div style={{marginTop:12}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>startAddSub(proj.id)}>+ Add subproject</button>
                  </div>
                )}

                {/* Actions */}
                <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:14}}>
                  {confirmId===proj.id ? (
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:12,color:"var(--danger)"}}>Delete this project, all subprojects, and all parts?</span>
                      <button className="btn btn-danger btn-sm" onClick={()=>deleteProject(proj.id)}>Yes, delete</button>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setConfirmId(null)}>Cancel</button>
                    </div>
                  ) : (
                    <>
                      {!isEditing && <button className="btn btn-edit btn-sm" onClick={e=>{e.stopPropagation();startEdit(proj);}}>✏ Edit project</button>}
                      <button className="btn btn-danger btn-sm" onClick={()=>setConfirmId(proj.id)}>Delete project</button>
                    </>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Type select — collapsed shows code (orange), expanded shows Name + Code ───
function TypeSelect({ typeName, typeCode, partTypes, onChange, width=82 }){
  const [open, setOpen] = useState(false);
  const wrap = React.useRef(null);

  useEffect(()=>{
    if(!open) return;
    const close = e=>{ if(wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return ()=>document.removeEventListener("mousedown", close);
  },[open]);

  return (
    <div ref={wrap} style={{position:"relative",width}}>
      <button onClick={()=>setOpen(v=>!v)}
        style={{
          width:"100%", padding:"7px 10px",
          border: open ? "1px solid var(--accent)" : "1px solid var(--paper3)",
          borderRadius:"var(--r)",
          background: open ? "#fff" : "var(--paper)",
          cursor:"pointer", textAlign:"left",
          fontFamily:"'JetBrains Mono',monospace",
          fontSize:13, fontWeight:typeCode?700:500,
          color: typeCode ? "var(--accent)" : "var(--ink3)",
          display:"flex", justifyContent:"space-between", alignItems:"center", gap:6,
          outline:"none",
        }}>
        <span>{typeCode || "—"}</span>
        <span style={{fontSize:9,color:"var(--ink3)",lineHeight:1}}>▾</span>
      </button>

      {open && (
        <div style={{
          position:"absolute", top:"calc(100% + 3px)", left:0, minWidth:"max(200px, 100%)",
          background:"#fff", border:"1px solid var(--paper3)", borderRadius:"var(--r)",
          boxShadow:"0 6px 22px rgba(0,0,0,.14)", overflow:"hidden", zIndex:600,
        }}>
          <div onClick={()=>{ onChange("",""); setOpen(false); }}
            style={{padding:"7px 12px",fontSize:12,color:"var(--ink3)",fontStyle:"italic",
              cursor:"pointer",borderBottom:"1px solid var(--paper2)",background:!typeCode?"var(--paper)":"#fff"}}>
            — none —
          </div>
          {partTypes.map(t=>{
            const isSel = typeName===t.name;
            return (
              <div key={t.name}
                onClick={()=>{ onChange(t.name, t.code); setOpen(false); }}
                style={{
                  padding:"8px 12px", cursor:"pointer", fontSize:13,
                  background: isSel ? "var(--paper)" : "#fff",
                  display:"flex", justifyContent:"space-between", alignItems:"center", gap:10,
                  borderBottom:"1px solid var(--paper2)",
                }}
                onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"}
                onMouseLeave={e=>e.currentTarget.style.background=isSel?"var(--paper)":"#fff"}>
                <span style={{color:"var(--ink)",fontWeight:isSel?500:400}}>{t.name}</span>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,fontWeight:700,
                  color:"var(--accent)",background:"var(--paper2)",padding:"2px 7px",borderRadius:3}}>[{t.code}]</span>
              </div>
            );
          })}
          {partTypes.length===0 && (
            <div style={{padding:"10px 12px",fontSize:12,color:"var(--ink3)",fontStyle:"italic"}}>
              No types yet — add some in Settings.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Designer ──────────────────────────────────────────────────────────────────
function DesignerPage({ stages, projects, subprojects, parts, setParts, partTypes, materials, markerSeq, setMarkerSeq }){
  const [openProj,  setOpenProj]  = useState(null);
  const [openSub,   setOpenSub]   = useState(null);
  const [drafts,    setDrafts]    = useState({});       // scopeKey -> draft
  const [errs,      setErrs]      = useState({});       // scopeKey -> error string
  const [colOrder,  setColOrder]  = useState(["description","dims","material","stage","ok","notes"]);
  const [confirmDel, setConfirmDel] = useState(null); // part being confirmed for deletion

  const sorted = [...stages].sort((a,b)=>a.order-b.order);

  function emptyDraft(materialId){
    return {suffix:"", type:"", typeCode:"", description:"", length:"", width:"", height:"", materialId: materialId||"", notes:""};
  }
  function getDraft(scopeKey, defaultMat){
    return drafts[scopeKey] || emptyDraft(defaultMat);
  }
  function updateDraft(scopeKey, defaultMat, key, val){
    setDrafts(prev=>({...prev,[scopeKey]:{...getDraft(scopeKey, defaultMat),[key]:val}}));
  }
  function setErr(scopeKey, msg){
    setErrs(prev=>({...prev,[scopeKey]:msg}));
  }

  function addPart(scopeKey, projectId, subprojectId, defaultMat){
    const d = getDraft(scopeKey, defaultMat);
    const suf = d.suffix.trim().toUpperCase();
    if(!suf){ setErr(scopeKey,"Part ID is required."); return; }
    const dup = parts.some(p =>
      p.projectId===projectId &&
      (p.subprojectId||null)===(subprojectId||null) &&
      p.suffix===suf && p.typeCode===d.typeCode
    );
    if(dup){ setErr(scopeKey,`"${suf}${d.typeCode}" already exists in this scope.`); return; }
    setErr(scopeKey,"");
    // Generate a unique marker code, skipping any already-used codes (rare).
    const used = new Set(parts.filter(p=>p.markerCode).map(p=>p.markerCode));
    let seq = markerSeq, code;
    do { code = markerSeqToCode(seq++); } while(used.has(code));
    setParts(prev=>[...prev,{
      id:uid(), projectId, subprojectId:subprojectId||null,
      suffix:suf, type:d.type, typeCode:d.typeCode,
      description:d.description.trim(),
      length:d.length, width:d.width, height:d.height,
      materialId: d.materialId || null,
      notes:d.notes.trim(), okToManufacture:false,
      stageId:null, comments:[], createdAt:new Date().toISOString(),
      markerCode: code,
    }]);
    setMarkerSeq(seq);
    // reset draft for this scope, keep default material
    setDrafts(prev=>({...prev,[scopeKey]:emptyDraft(defaultMat)}));
  }

  function upd(id,key,val){ setParts(prev=>prev.map(p=>p.id===id?{...p,[key]:val}:p)); }
  function updType(id, name){
    const pt = partTypes.find(t=>t.name===name);
    setParts(prev=>prev.map(p=>p.id===id?{...p,type:name,typeCode:pt?.code||""}:p));
  }
  function toggleOk(id){ setParts(prev=>prev.map(p=>p.id===id?{...p,okToManufacture:!p.okToManufacture}:p)); }
  function delPart(id){
    // Soft-delete: flag the part so it remains visible to the Workshop until
    // they confirm permanent removal. Hard removal happens from the Workshop.
    setParts(prev=>prev.map(p=>p.id===id?{...p,deletedByDesigner:true,deletedByDesignerAt:new Date().toISOString()}:p));
  }

  function moveCol(key, dir){
    setColOrder(prev=>{
      const i=prev.indexOf(key), j=i+dir;
      if(j<0||j>=prev.length) return prev;
      const next=[...prev];
      [next[i],next[j]]=[next[j],next[i]];
      return next;
    });
  }

  // Column definitions — th + populated cell + empty-row cell
  const COL_DEF = {
    description:{
      th:()=>"Description",
      td:(part)=><input className="input" value={part.description||""} placeholder="—" onChange={e=>upd(part.id,"description",e.target.value)} style={{minWidth:140}} />,
      empty:(d,sk,dm)=><input className="input" value={d.description} placeholder="—" onChange={e=>updateDraft(sk,dm,"description",e.target.value)} style={{minWidth:140}} />,
    },
    dims:{
      th:()=>"L × W × H (mm)",
      td:(part)=>(
        <div className="dim-wrap">
          <input className="dim-in" value={part.length||""} placeholder="L" onChange={e=>upd(part.id,"length",e.target.value)} />
          <span className="dim-sep">×</span>
          <input className="dim-in" value={part.width||""}  placeholder="W" onChange={e=>upd(part.id,"width",e.target.value)} />
          <span className="dim-sep">×</span>
          <input className="dim-in" value={part.height||""} placeholder="H" onChange={e=>upd(part.id,"height",e.target.value)} />
        </div>
      ),
      empty:(d,sk,dm)=>(
        <div className="dim-wrap">
          <input className="dim-in" value={d.length} placeholder="L" onChange={e=>updateDraft(sk,dm,"length",e.target.value)} />
          <span className="dim-sep">×</span>
          <input className="dim-in" value={d.width}  placeholder="W" onChange={e=>updateDraft(sk,dm,"width",e.target.value)} />
          <span className="dim-sep">×</span>
          <input className="dim-in" value={d.height} placeholder="H" onChange={e=>updateDraft(sk,dm,"height",e.target.value)} />
        </div>
      ),
    },
    material:{
      th:()=>"Material",
      td:(part)=>(
        <select className="sel" value={part.materialId||""} onChange={e=>upd(part.id,"materialId",e.target.value||null)} style={{minWidth:110}}>
          <option value="">—</option>
          {materials.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      ),
      empty:(d,sk,dm)=>(
        <select className="sel" value={d.materialId} onChange={e=>updateDraft(sk,dm,"materialId",e.target.value)} style={{minWidth:110}}>
          <option value="">—</option>
          {materials.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      ),
    },
    stage:{
      th:()=>"Stage",
      td:(part)=>{
        const si=sorted.findIndex(s=>s.id===part.stageId);
        const stage=sorted[si];
        return <span className="stage-pill"><span className="dot" style={{background:stage?stageColor(stage):"#ccc"}} />{stage?stage.name:"Not started"}</span>;
      },
      empty:()=><span style={{color:"var(--ink3)",fontSize:11}}>—</span>,
    },
    ok:{
      th:()=>"OK to make",
      td:(part)=>(
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <div className={`toggle${part.okToManufacture?" on":""}`} onClick={()=>toggleOk(part.id)} />
          <span style={{fontSize:11,color:part.okToManufacture?"var(--success)":"var(--ink3)"}}>{part.okToManufacture?"Yes":"No"}</span>
        </div>
      ),
      empty:()=><span style={{color:"var(--ink3)",fontSize:11}}>—</span>,
    },
    notes:{
      th:()=>"Notes",
      td:(part)=><input className="input" value={part.notes||""} placeholder="—" onChange={e=>upd(part.id,"notes",e.target.value)} style={{minWidth:140}} />,
      empty:(d,sk,dm)=><input className="input" value={d.notes} placeholder="—" onChange={e=>updateDraft(sk,dm,"notes",e.target.value)} style={{minWidth:140}} />,
    },
  };

  // ── render parts table for a scope (project root OR a subproject) ──
  function renderScope(projectId, projectCode, subprojectId, subCode, defaultMat, list){
    const scopeKey  = subprojectId ? `sub:${subprojectId}` : `proj:${projectId}`;
    const draft     = getDraft(scopeKey, defaultMat);
    const err       = errs[scopeKey];
    const fullPrefix= subCode ? `${projectCode}-${subCode}-` : `${projectCode}-`;
    const totalCols = 4 + colOrder.length; // 3D, Part ID, Type, ...cols, delete

    return (
      <div style={{overflowX:"auto"}}>
        <table className="tbl" style={{minWidth:830}}>
          <thead>
            <tr>
              <th style={{paddingLeft:14,whiteSpace:"nowrap",width:96}}>3D</th>
              <th style={{whiteSpace:"nowrap"}}>Part ID</th>
              <th style={{whiteSpace:"nowrap"}}>Type</th>
              {colOrder.map((key,i)=>(
                <th key={key} style={{whiteSpace:"nowrap"}}>
                  <div style={{display:"flex",alignItems:"center",gap:4}}>
                    <span style={{flex:1}}>{COL_DEF[key].th()}</span>
                    <span style={{display:"flex",gap:1,flexShrink:0}}>
                      <button onClick={()=>moveCol(key,-1)} disabled={i===0}
                        style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",fontSize:10,
                          color:i===0?"var(--paper3)":"var(--ink3)",lineHeight:1}} title="Move left">◀</button>
                      <button onClick={()=>moveCol(key,1)} disabled={i===colOrder.length-1}
                        style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",fontSize:10,
                          color:i===colOrder.length-1?"var(--paper3)":"var(--ink3)",lineHeight:1}} title="Move right">▶</button>
                    </span>
                  </div>
                </th>
              ))}
              <th></th>
            </tr>
          </thead>
          <tbody>
            {/* Populated rows */}
            {list.map(part=>(
              <tr key={part.id}>
                <td style={{paddingLeft:14}}>
                  <LoadFileButton
                    part={part}
                    onUploaded={meta=>setParts(prev=>prev.map(p=>p.id===part.id?{...p,stpFile:meta}:p))}
                    onCleared={()=>setParts(prev=>prev.map(p=>p.id===part.id?{...p,stpFile:null}:p))}
                  />
                </td>
                <td>
                  <div style={{display:"flex",alignItems:"center",gap:3,marginBottom:2}}>
                    <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"var(--ink3)",whiteSpace:"nowrap"}}>{fullPrefix}</span>
                    <input value={part.suffix||""} placeholder="ID"
                      onChange={e=>upd(part.id,"suffix",e.target.value.toUpperCase())}
                      style={{width:52,padding:"4px 5px",border:"1px solid var(--paper3)",borderRadius:4,
                        fontFamily:"'JetBrains Mono',monospace",fontSize:12,textTransform:"uppercase",
                        background:"var(--paper)",color:"var(--accent)",fontWeight:700,outline:"none"}} />
                  </div>
                  {part.markerCode && (
                    <div style={{display:"flex",alignItems:"center",gap:5,marginTop:2}}>
                      <MarkerSVG code={part.markerCode} size={38} />
                      <button
                        title="Click to copy marker code"
                        onClick={e=>{ e.stopPropagation(); navigator.clipboard?.writeText(part.markerCode); }}
                        style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,
                          background:"none",border:"none",cursor:"pointer",
                          color:"var(--ink3)",padding:"2px 4px",letterSpacing:".06em"}}>
                        {part.markerCode}
                      </button>
                      <button
                        title="Download marker as SVG (for printing template)"
                        onClick={e=>{ e.stopPropagation(); downloadMarkerSVG(part.markerCode, getPartId(part, projects, subprojects)); }}
                        style={{background:"none",border:"none",cursor:"pointer",fontSize:11,padding:"2px",color:"var(--ink3)"}}>
                        ⤓
                      </button>
                    </div>
                  )}
                </td>
                <td>
                  <TypeSelect typeName={part.type} typeCode={part.typeCode} partTypes={partTypes}
                    onChange={(name,code)=>setParts(prev=>prev.map(p=>p.id===part.id?{...p,type:name,typeCode:code}:p))}
                    width={82} />
                </td>
                {colOrder.map(key=><td key={key}>{COL_DEF[key].td(part)}</td>)}
                <td><button className="btn btn-danger btn-icon btn-sm" onClick={()=>setConfirmDel(part)} title="Delete">✕</button></td>
              </tr>
            ))}

            {/* Empty draft row — always at the bottom */}
            <tr style={{background:"#FFFAF3"}}>
              <td style={{paddingLeft:14,borderTop:"2px dashed var(--paper3)",color:"var(--ink3)",fontSize:11,fontStyle:"italic"}}>
                — after add —
              </td>
              <td style={{borderTop:"2px dashed var(--paper3)"}}>
                <div style={{display:"flex",alignItems:"center",gap:3}}>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"var(--ink3)",whiteSpace:"nowrap"}}>{fullPrefix}</span>
                  <input value={draft.suffix} placeholder="ID *"
                    onChange={e=>{ setErr(scopeKey,""); updateDraft(scopeKey,defaultMat,"suffix",e.target.value.toUpperCase()); }}
                    onKeyDown={e=>{ if(e.key==="Enter") addPart(scopeKey,projectId,subprojectId,defaultMat); }}
                    style={{width:52,padding:"4px 5px",
                      border: err ? "1px solid var(--danger)" : "1px solid var(--paper3)",
                      borderRadius:4,
                      fontFamily:"'JetBrains Mono',monospace",fontSize:12,textTransform:"uppercase",
                      background:"#fff",color:"var(--accent)",fontWeight:700,outline:"none"}} />
                </div>
              </td>
              <td style={{borderTop:"2px dashed var(--paper3)"}}>
                <TypeSelect typeName={draft.type} typeCode={draft.typeCode} partTypes={partTypes}
                  onChange={(name,code)=>setDrafts(prev=>({...prev,[scopeKey]:{...getDraft(scopeKey,defaultMat),type:name,typeCode:code}}))}
                  width={82} />
              </td>
              {colOrder.map(key=>(
                <td key={key} style={{borderTop:"2px dashed var(--paper3)"}}>{COL_DEF[key].empty(draft, scopeKey, defaultMat)}</td>
              ))}
              <td style={{borderTop:"2px dashed var(--paper3)"}}>
                <button className="btn btn-primary btn-sm"
                  onClick={()=>addPart(scopeKey,projectId,subprojectId,defaultMat)}
                  title="Add this part">+ Add</button>
              </td>
            </tr>
            {err && (
              <tr>
                <td colSpan={totalCols} style={{paddingLeft:16,paddingTop:0,paddingBottom:8}}>
                  <div className="err">⚠ {err}</div>
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    );
  }

  return (
    <div>
      <h1>Designer</h1>

      {/* Delete confirmation modal */}
      {confirmDel && (() => {
        const part = confirmDel;
        const hasProgressed = !!part.stageId;
        const wasApproved   = !!part.okToManufacture || !!part.wasApproved;
        const stageName     = part.stageId ? (sorted.find(s=>s.id===part.stageId)?.name||"") : "";
        return (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:2700,
            display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
            <div style={{background:"#fff",borderRadius:12,padding:22,width:"min(92vw,460px)",
              boxShadow:"0 12px 40px rgba(0,0,0,.3)"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <span style={{fontSize:22}}>🗑</span>
                <h3 style={{margin:0}}>Delete this part?</h3>
              </div>
              <div style={{padding:"10px 12px",background:"var(--paper)",border:"1px solid var(--paper3)",
                borderRadius:6,marginBottom:12}}>
                <span className="part-id" style={{fontSize:14}}>{getPartId(part, projects, subprojects)}</span>
                {part.description && <div style={{fontSize:12,color:"var(--ink3)",marginTop:3}}>{part.description}</div>}
              </div>
              {hasProgressed ? (
                <div style={{padding:"10px 12px",background:"#FDF3E3",border:"1px solid #F0C040",borderRadius:6,
                  fontSize:13,color:"#7A5A10",lineHeight:1.55,marginBottom:14}}>
                  ⚠ <strong>Production has already started</strong> — this part is currently at stage <strong>"{stageName}"</strong>.
                  <br/>The part will be marked for deletion and sent to the Workshop, highlighted in red, where the workshop manager confirms permanent removal.
                </div>
              ) : wasApproved ? (
                <div style={{padding:"10px 12px",background:"var(--paper)",border:"1px solid var(--paper3)",borderRadius:6,
                  fontSize:13,color:"var(--ink2)",lineHeight:1.55,marginBottom:14}}>
                  This part was approved for manufacture. It will appear in the Workshop highlighted in red, where the workshop manager can confirm permanent removal.
                </div>
              ) : (
                <div style={{padding:"10px 12px",background:"var(--paper)",border:"1px solid var(--paper3)",borderRadius:6,
                  fontSize:13,color:"var(--ink2)",lineHeight:1.55,marginBottom:14}}>
                  This part has not yet been approved or started. It will appear in the Workshop highlighted in red, where it can be permanently removed.
                </div>
              )}
              <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
                <button className="btn btn-ghost" onClick={()=>setConfirmDel(null)}>Cancel</button>
                <button className="btn btn-danger" onClick={()=>{delPart(part.id);setConfirmDel(null);}}>
                  Send to Workshop for removal
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {projects.length===0 && <div className="empty">No projects yet — create one in the Manager page first.</div>}

      {projects.map(proj=>{
        const subs       = subprojects.filter(s=>s.projectId===proj.id);
        const hasSubs    = subs.length>0;
        // exclude soft-deleted parts from the Designer view (they live in the Workshop)
        const allProjPts = parts.filter(p=>p.projectId===proj.id && !p.deletedByDesigner);
        const directPts  = allProjPts.filter(p=>!p.subprojectId);
        const isOpen     = openProj===proj.id;

        return (
          <div key={proj.id} className="proj-row">
            <div className="proj-head" onClick={()=>setOpenProj(isOpen?null:proj.id)}>
              <div>
                <div className="proj-title">
                  {proj.name}
                  {proj.projectCode && <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"var(--accent)",marginLeft:8,fontWeight:400}}>[{proj.projectCode}]</span>}
                </div>
                <div className="proj-sub">
                  {proj.client||"—"}
                  {hasSubs ? ` · ${subs.length} subproject${subs.length!==1?"s":""}` : ""}
                  {" · "}{allProjPts.length} part{allProjPts.length!==1?"s":""}
                  {proj.materialId && (() => {
                    const mat = materials.find(m=>m.id===proj.materialId);
                    return mat ? ` · default ${mat.name}` : "";
                  })()}
                </div>
              </div>
              <span style={{color:"var(--ink3)",fontSize:14}}>{isOpen?"▲":"▼"}</span>
            </div>

            {isOpen && (
              <div className="proj-body">
                {/* If no subprojects, parts live directly on the project */}
                {!hasSubs && renderScope(proj.id, proj.projectCode, null, null, proj.materialId, directPts)}

                {/* Subprojects: each expandable */}
                {hasSubs && subs.map(s=>{
                  const subPts = parts.filter(p=>p.subprojectId===s.id && !p.deletedByDesigner);
                  const isSOp = openSub===s.id;
                  return (
                    <div key={s.id} style={{marginBottom:10,marginLeft:18,borderLeft:"3px solid var(--paper3)",paddingLeft:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",
                          padding:"10px 12px",background:"var(--paper)",borderRadius:8,border:"1px solid var(--paper3)"}}
                          onClick={()=>setOpenSub(isSOp?null:s.id)}>
                        <div>
                          <div style={{fontFamily:"'Jost',sans-serif",fontWeight:700,fontSize:13}}>
                            ↳ {s.name}
                            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:"var(--accent)",marginLeft:8,fontWeight:400}}>[{proj.projectCode}-{s.subCode}]</span>
                          </div>
                          <div style={{fontSize:11,color:"var(--ink3)",marginTop:2}}>
                            {subPts.length} part{subPts.length!==1?"s":""}
                          </div>
                        </div>
                        <span style={{color:"var(--ink3)",fontSize:12}}>{isSOp?"▲":"▼"}</span>
                      </div>
                      {isSOp && (
                        <div style={{padding:"10px 0 4px 8px"}}>
                          {renderScope(proj.id, proj.projectCode, s.id, s.subCode, proj.materialId, subPts)}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── STP file viewer (three.js + occt-import-js, with custom orbit controls) ──
let _occtPromise = null;
function getOcct(){
  // load occt-import-js WASM once and cache the promise
  if(_occtPromise) return _occtPromise;
  if(!window.occtimportjs){
    return Promise.reject(new Error("occt-import-js not loaded"));
  }
  _occtPromise = window.occtimportjs({
    locateFile: f => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.22/dist/${f}`,
  });
  return _occtPromise;
}

function STPViewer({ partId, fileName, fileSize }){
  const containerRef = React.useRef(null);
  const canvasRef    = React.useRef(null);
  const [status, setStatus] = useState("loading"); // loading | parsing | ready | error | notfound
  const [errMsg, setErrMsg] = useState("");

  useEffect(()=>{
    let cancelled = false;
    let cleanup = ()=>{};
    setStatus("loading"); setErrMsg("");

    (async ()=>{
      try{
        if(typeof THREE==="undefined") throw new Error("three.js not loaded");
        const buffer = await loadStpFile(partId);
        if(cancelled) return;
        if(!buffer){ setStatus("notfound"); return; }

        setStatus("parsing");
        const occt = await getOcct();
        if(cancelled) return;

        const u8 = new Uint8Array(buffer);
        const result = occt.ReadStepFile(u8, null);
        if(!result || !result.success){ throw new Error("STEP parse failed"); }
        if(cancelled) return;

        cleanup = initThreeScene(canvasRef.current, containerRef.current, result.meshes);
        setStatus("ready");
      }catch(e){
        if(cancelled) return;
        console.error("STP viewer error:", e);
        setErrMsg(e.message || String(e));
        setStatus("error");
      }
    })();

    return ()=>{ cancelled = true; cleanup(); };
  },[partId]);

  return (
    <div ref={containerRef} style={{position:"relative",width:"100%",height:300,
