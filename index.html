      background:"#18181B",borderRadius:8,overflow:"hidden",border:"1px solid var(--paper3)"}}>
      <canvas ref={canvasRef} style={{display:"block",width:"100%",height:"100%",
        cursor: status==="ready" ? "grab" : "default"}} />
      {status!=="ready" && (
        <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
          color:"#F4F4F5",fontSize:12,padding:14,textAlign:"center"}}>
          {status==="loading" && <span>Loading 3D file…</span>}
          {status==="parsing" && <span>Parsing STEP geometry — large files may take 10-30 s…</span>}
          {status==="notfound" && <span>3D file missing from local storage. Re-upload in the Designer page.</span>}
          {status==="error" && <span style={{color:"#FFAB87"}}>Could not load 3D model:<br/><span style={{fontSize:10,opacity:.8}}>{errMsg}</span></span>}
        </div>
      )}
      {status==="ready" && fileName && (
        <div style={{position:"absolute",left:8,bottom:6,fontSize:10,color:"rgba(245,240,232,.65)",
          fontFamily:"'JetBrains Mono',monospace",pointerEvents:"none"}}>
          {fileName} · {(fileSize/1024).toFixed(0)} KB
        </div>
      )}
      {status==="ready" && (
        <div style={{position:"absolute",right:8,bottom:6,fontSize:10,color:"rgba(245,240,232,.55)",pointerEvents:"none"}}>
          drag · rotate    shift+drag · pan    wheel · zoom
        </div>
      )}
    </div>
  );
}

// Build the three.js scene with custom orbit controls. Returns a cleanup fn.
function initThreeScene(canvas, container, meshes){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1A1814);

  // size from container
  const w = container.clientWidth, h = container.clientHeight || 300;
  const camera = new THREE.PerspectiveCamera(45, w/h, 0.1, 1e7);

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h, false);

  // lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.95); key.position.set(1,1.2,1).normalize(); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.4); fill.position.set(-1,-0.3,-0.7).normalize(); scene.add(fill);

  // build mesh group
  const group = new THREE.Group();
  const material = new THREE.MeshStandardMaterial({ color:0xC4A373, roughness:0.7, metalness:0.05, side:THREE.DoubleSide });
  (meshes||[]).forEach(m=>{
    if(!m.attributes?.position?.array) return;
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if(m.attributes.normal?.array){
      g.setAttribute("normal", new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    }
    if(m.index?.array){
      const idx = m.index.array;
      g.setIndex(idx.length > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));
    }
    if(!m.attributes.normal?.array) g.computeVertexNormals();
    group.add(new THREE.Mesh(g, material));
  });
  scene.add(group);

  // edges overlay for clearer geometry read
  const edgesMat = new THREE.LineBasicMaterial({color:0x000000, transparent:true, opacity:0.18});
  group.children.forEach(mesh=>{
    const eg = new THREE.EdgesGeometry(mesh.geometry, 28);
    group.add(new THREE.LineSegments(eg, edgesMat));
  });

  // center + fit camera
  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  group.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fitDist = maxDim * 1.8;

  // spherical camera state
  let radius = fitDist;
  let theta  = Math.PI/4;   // azimuth
  let phi    = Math.PI/3;   // polar
  const target = new THREE.Vector3(0,0,0);
  function updateCamera(){
    const x = radius*Math.sin(phi)*Math.cos(theta);
    const y = radius*Math.cos(phi);
    const z = radius*Math.sin(phi)*Math.sin(theta);
    camera.position.set(x+target.x, y+target.y, z+target.z);
    camera.lookAt(target);
  }
  updateCamera();

  // custom mouse controls
  let isDown = false, lastX=0, lastY=0, mode=null;
  function onDown(e){
    isDown = true; lastX = e.clientX; lastY = e.clientY;
    mode = (e.shiftKey || e.button===2) ? "pan" : "rotate";
    canvas.style.cursor = mode==="pan" ? "move" : "grabbing";
  }
  function onMove(e){
    if(!isDown) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if(mode==="rotate"){
      theta -= dx*0.008;
      phi   -= dy*0.008;
      phi = Math.max(0.05, Math.min(Math.PI-0.05, phi));
    } else if(mode==="pan"){
      const panSpeed = radius * 0.0014;
      const right = new THREE.Vector3();
      const up    = new THREE.Vector3();
      camera.getWorldDirection(new THREE.Vector3());
      right.setFromMatrixColumn(camera.matrix, 0);
      up.setFromMatrixColumn(camera.matrix, 1);
      target.addScaledVector(right, -dx*panSpeed);
      target.addScaledVector(up,     dy*panSpeed);
    }
    updateCamera();
  }
  function onUp(){ isDown=false; mode=null; canvas.style.cursor="grab"; }
  function onWheel(e){
    e.preventDefault();
    const f = Math.pow(1.0015, e.deltaY);
    radius = Math.max(maxDim*0.05, Math.min(maxDim*50, radius*f));
    updateCamera();
  }
  function onContext(e){ e.preventDefault(); }

  canvas.addEventListener("mousedown", onDown);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("wheel", onWheel, {passive:false});
  canvas.addEventListener("contextmenu", onContext);

  // touch
  let touchStart = null;
  function onTouchStart(e){
    if(e.touches.length===1){ const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY,mode:"rotate"}; }
    else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      touchStart={dist:Math.hypot(dx,dy),mode:"pinch"};
    }
  }
  function onTouchMove(e){
    if(!touchStart) return;
    e.preventDefault();
    if(touchStart.mode==="rotate" && e.touches.length===1){
      const t = e.touches[0];
      const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y;
      theta -= dx*0.008; phi -= dy*0.008;
      phi = Math.max(0.05, Math.min(Math.PI-0.05, phi));
      touchStart.x=t.clientX; touchStart.y=t.clientY;
      updateCamera();
    } else if(touchStart.mode==="pinch" && e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      const d = Math.hypot(dx,dy);
      const f = touchStart.dist/d;
      radius = Math.max(maxDim*0.05, Math.min(maxDim*50, radius*f));
      touchStart.dist = d;
      updateCamera();
    }
  }
  function onTouchEnd(){ touchStart=null; }
  canvas.addEventListener("touchstart", onTouchStart, {passive:false});
  canvas.addEventListener("touchmove",  onTouchMove,  {passive:false});
  canvas.addEventListener("touchend",   onTouchEnd);

  // resize
  function onResize(){
    const w = container.clientWidth, h = container.clientHeight || 300;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(onResize); ro.observe(container);

  // render loop
  let running = true;
  function loop(){
    if(!running) return;
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();

  return ()=>{
    running = false;
    ro.disconnect();
    canvas.removeEventListener("mousedown", onDown);
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
    canvas.removeEventListener("wheel", onWheel);
    canvas.removeEventListener("contextmenu", onContext);
    canvas.removeEventListener("touchstart", onTouchStart);
    canvas.removeEventListener("touchmove",  onTouchMove);
    canvas.removeEventListener("touchend",   onTouchEnd);
    renderer.dispose();
    group.children.forEach(o=>{ o.geometry?.dispose(); });
    material.dispose();
    edgesMat.dispose();
  };
}

// ── LoadFileButton — used in Designer rows ────────────────────────────────────
function LoadFileButton({ part, onUploaded, onCleared }){
  const inputRef = React.useRef(null);
  const [busy,   setBusy]   = useState(false);
  const hasFile = !!part.stpFile;

  async function pick(e){
    const f = e.target.files?.[0];
    e.target.value = "";
    if(!f) return;
    if(f.size > 80 * 1024 * 1024){
      alert("File too large (max 80 MB).");
      return;
    }
    setBusy(true);
    try{
      const buf = await f.arrayBuffer();
      await saveStpFile(part.id, buf);
      onUploaded({ name:f.name, size:f.size, uploadedAt:new Date().toISOString() });
    }catch(err){
      alert("Could not save file: "+err.message);
    }finally{
      setBusy(false);
    }
  }
  async function clear(e){
    e.stopPropagation();
    if(!confirm("Remove the 3D file from this part?")) return;
    await deleteStpFile(part.id);
    onCleared();
  }

  return (
    <div style={{display:"flex",alignItems:"center",gap:3}}>
      <input ref={inputRef} type="file" accept=".stp,.step,.STP,.STEP"
        onChange={pick} style={{display:"none"}} />
      <button
        className={`btn btn-sm ${hasFile?"btn-success":"btn-ghost"}`}
        style={{padding:"5px 8px",fontSize:11,minHeight:0,minWidth:0,fontFamily:hasFile?"'JetBrains Mono',monospace":undefined}}
        onClick={()=>inputRef.current?.click()}
        disabled={busy}
        title={hasFile ? `Replace · ${part.stpFile.name} (${(part.stpFile.size/1024).toFixed(0)} KB)` : "Load .stp / .step file"}>
        {busy ? "…" : hasFile ? "✓ 3D" : "📦 3D"}
      </button>
      {hasFile && !busy && (
        <button className="btn btn-danger btn-icon btn-sm"
          style={{padding:"3px 5px",fontSize:10,minHeight:0,minWidth:0}}
          title="Remove 3D file"
          onClick={clear}>✕</button>
      )}
    </div>
  );
}

// ── QC modal: shown when a part must pass checks to advance a stage ──────────
function QCModal({ part, fromStage, toStage, mode, partLabel, onConfirm, onCancel }){
  const isFinalize = mode==="finalize";
  const checks = fromStage?.qcChecks || [];
  const [values, setValues] = useState(()=>{
    const init={};
    checks.forEach(qc=>{ init[qc.id] = qc.type==="tick" ? false : ""; });
    return init;
  });

  const allDone = checks.every(qc=>{
    const v = values[qc.id];
    return qc.type==="tick" ? v===true : (v||"").trim().length>0;
  });

  function submit(){
    if(!allDone) return;
    onConfirm(checks.map(qc=>({
      qcId:qc.id, type:qc.type, prompt:qc.prompt, value:values[qc.id],
    })));
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:2800,
      display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:"#fff",borderRadius:12,padding:20,width:"min(92vw,460px)",
        maxHeight:"90vh",overflowY:"auto",boxShadow:"0 12px 40px rgba(0,0,0,.3)"}}>

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
          <span style={{fontSize:20}}>{isFinalize?"🏁":"🛡"}</span>
          <h3 style={{margin:0,fontSize:14,letterSpacing:".04em"}}>
            {isFinalize ? "Final quality control" : "Quality control"}
          </h3>
        </div>
        <p style={{fontSize:13,color:"var(--ink2)",lineHeight:1.55,marginBottom:14}}>
          {isFinalize ? (
            <>Complete the final checks below to mark <strong style={{fontFamily:"'JetBrains Mono',monospace",color:"var(--accent)"}}>{partLabel}</strong> as <strong>Complete</strong> at <strong>{fromStage?.name}</strong>.</>
          ) : (
            <>Complete the checks below before advancing <strong style={{fontFamily:"'JetBrains Mono',monospace",color:"var(--accent)"}}>{partLabel}</strong> from <strong>{fromStage?.name}</strong> to <strong>{toStage?.name||"the next stage"}</strong>.</>
          )}
        </p>

        <div style={{borderTop:"1px solid var(--paper2)",paddingTop:14}}>
          {checks.map(qc=>(
            <div key={qc.id} style={{marginBottom:14}}>
              {qc.type==="tick" ? (
                <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",
                  padding:"8px 10px",borderRadius:6,
                  background: values[qc.id]?"#E8F5EA":"var(--paper)",
                  border: values[qc.id]?"1px solid #A0D4A8":"1px solid var(--paper3)",
                  transition:"background .15s, border-color .15s"}}>
                  <input type="checkbox" checked={!!values[qc.id]}
                    onChange={e=>setValues(v=>({...v,[qc.id]:e.target.checked}))}
                    style={{width:18,height:18,marginTop:1,cursor:"pointer",accentColor:"var(--success)"}} />
                  <span style={{fontSize:13,lineHeight:1.5,flex:1,
                    textDecoration:values[qc.id]?"line-through":"none",
                    color:values[qc.id]?"var(--success)":"var(--ink)"}}>{qc.prompt}</span>
                </label>
              ) : (
                <div>
                  <label className="label" style={{marginBottom:5,color:"var(--ink2)",fontSize:11,textTransform:"none",letterSpacing:0}}>
                    📝 {qc.prompt}
                  </label>
                  <input className="input" type="text" value={values[qc.id]||""}
                    placeholder="Type your answer…"
                    onChange={e=>setValues(v=>({...v,[qc.id]:e.target.value}))} />
                </div>
              )}
            </div>
          ))}
        </div>

        <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:6,paddingTop:14,borderTop:"1px solid var(--paper2)"}}>
          <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary" onClick={submit} disabled={!allDone}>
            {allDone ? (isFinalize ? "Confirm & finalize ✓" : "Confirm & advance →") : "Complete all checks"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Workshop ──────────────────────────────────────────────────────────────────
function WorkshopPage({ stages, projects, subprojects, parts, setParts, materials }){
  const [projFilter,  setProjFilter]  = useState("all");
  const [stageFilter, setStageFilter] = useState("all");
  const [expanded,    setExpanded]    = useState({});
  const [noteText,    setNoteText]    = useState({});
  const [scanning,    setScanning]    = useState(false);
  const [foundId,     setFoundId]     = useState(null);
  const [qcModal,     setQcModal]     = useState(null);   // {partId, fromStage, toStage}
  const cardRefs = React.useRef({});

  const sorted  = [...stages].sort((a,b)=>a.order-b.order);
  const lastId  = sorted[sorted.length-1]?.id;
  const lastStage = sorted[sorted.length-1];
  const lastNeedsQc = (lastStage?.qcChecks?.length||0) > 0;
  // All parts appear in the workshop (including soft-deleted ones for review).
  // Parts not currently OK-to-make are shown greyed-out (on hold).
  const okParts = parts;

  // Helpers for new "finalized" model
  function isCompletePart(p){ return p.stageId===lastId && (!lastNeedsQc || !!p.finalized); }
  function isAwaitingFinalQc(p){ return p.stageId===lastId && lastNeedsQc && !p.finalized; }

  // projFilter can be "all", "proj:<id>" or "sub:<id>"
  const projFiltered =
    projFilter==="all" ? okParts :
    projFilter.startsWith("sub:")
      ? okParts.filter(p=>p.subprojectId===projFilter.slice(4))
      : okParts.filter(p=>{
          // "proj:<id>" or legacy plain id
          const pid = projFilter.startsWith("proj:") ? projFilter.slice(5) : projFilter;
          return p.projectId===pid;
        });

  const filtered =
    stageFilter==="all"  ? projFiltered :
    stageFilter==="none" ? projFiltered.filter(p=>!p.stageId) :
    projFiltered.filter(p=>p.stageId===stageFilter);

  function handleScan(code){
    setScanning(false);
    const found = parts.find(p=>p.markerCode===code);
    if(!found){ alert(`No part found for marker code "${code}".`); return; }
    // reset filters so the part is visible, then expand + scroll
    setProjFilter("all");
    setStageFilter("all");
    setFoundId(found.id);
    setExpanded(e=>({...e,[found.id]:true}));
    setTimeout(()=>{
      const el=cardRefs.current[found.id];
      if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
    },120);
    setTimeout(()=>setFoundId(null),2500);
  }

  function advance(partId){
    const part = parts.find(p=>p.id===partId);
    if(!part) return;
    // Not yet started → first stage. No QC required for the initial start.
    if(!part.stageId){
      doAdvance(partId, null);
      return;
    }
    const i = sorted.findIndex(s=>s.id===part.stageId);
    if(i<0) return;
    // Already at last stage → finalization path, not normal advance
    if(i>=sorted.length-1){
      finalize(partId);
      return;
    }
    const fromStage = sorted[i];
    const toStage   = sorted[i+1];
    const checks    = fromStage.qcChecks || [];
    if(checks.length===0){
      doAdvance(partId, null);
      return;
    }
    setQcModal({ partId, fromStage, toStage, mode:"advance" });
  }

  function finalize(partId){
    // Trigger last-stage QC; part stays on last stage but gets `finalized` flag.
    const part = parts.find(p=>p.id===partId);
    if(!part || part.stageId!==lastId) return;
    const checks = lastStage?.qcChecks || [];
    if(checks.length===0){
      // no QC defined → finalize directly
      setParts(prev=>prev.map(p=>p.id===partId?{...p,finalized:true}:p));
      return;
    }
    setQcModal({ partId, fromStage:lastStage, toStage:null, mode:"finalize" });
  }

  function doAdvance(partId, qcResults){
    setParts(prev=>prev.map(p=>{
      if(p.id!==partId) return p;
      if(!p.stageId){
        const first = sorted[0];
        const next = {...p, stageId:first?.id};
        // If first stage is also last AND no QC, auto-finalize
        if(first?.id===lastId && !lastNeedsQc) next.finalized = true;
        return next;
      }
      const i=sorted.findIndex(s=>s.id===p.stageId);
      if(i<0||i>=sorted.length-1) return p;
      const newStageId = sorted[i+1].id;
      const updated = {...p, stageId:newStageId};
      // If we just landed on the last stage and it has no QC, auto-finalize
      if(newStageId===lastId && !lastNeedsQc) updated.finalized = true;
      if(qcResults && qcResults.length>0){
        const entry = {
          stageId: sorted[i].id,
          stageName: sorted[i].name,
          date: new Date().toISOString(),
          checks: qcResults,
        };
        updated.qcResults = [...(p.qcResults||[]), entry];
      }
      return updated;
    }));
  }

  function doFinalize(partId, qcResults){
    setParts(prev=>prev.map(p=>{
      if(p.id!==partId) return p;
      const updated = {...p, finalized:true};
      if(qcResults && qcResults.length>0){
        const entry = {
          stageId: lastStage.id,
          stageName: lastStage.name,
          date: new Date().toISOString(),
          checks: qcResults,
          isFinal: true,
        };
        updated.qcResults = [...(p.qcResults||[]), entry];
      }
      return updated;
    }));
  }

  function goBack(partId){
    // Moving back also clears the finalized flag.
    setParts(prev=>prev.map(p=>{
      if(p.id!==partId) return p;
      const i=sorted.findIndex(s=>s.id===p.stageId);
      if(i<=0) return {...p,stageId:null,finalized:false};
      return {...p,stageId:sorted[i-1].id,finalized:false};
    }));
  }

  // Permanent removal — only the Workshop can hard-delete
  const [confirmRemoveId, setConfirmRemoveId] = useState(null);
  function permanentlyRemove(id){
    deleteStpFile(id); // best-effort: clear 3D file from IndexedDB
    setParts(prev=>prev.filter(p=>p.id!==id));
    setConfirmRemoveId(null);
  }

  // Restore a part the designer flagged for deletion (manager override)
  function restorePart(id){
    setParts(prev=>prev.map(p=>p.id===id?{...p,deletedByDesigner:false,deletedByDesignerAt:null}:p));
  }

  function saveNote(partId){
    const txt=(noteText[partId]||"").trim();
    if(!txt) return;
    setParts(prev=>prev.map(p=>p.id!==partId?p:{
      ...p,comments:[...(p.comments||[]),{text:txt,date:new Date().toISOString()}]
    }));
    setNoteText(n=>({...n,[partId]:""}));
  }
  function toggleExpand(id){ setExpanded(e=>({...e,[id]:!e[id]})); }
  function projName(id){ return projects.find(p=>p.id===id)?.name||"—"; }

  const activeProjects = projects.filter(p=>okParts.some(pt=>pt.projectId===p.id));

  return (
    <div>
      {scanning && <MarkerSearch onFound={handleScan} onClose={()=>setScanning(false)} />}
      {qcModal && (() => {
        const part = parts.find(p=>p.id===qcModal.partId);
        if(!part) return null;
        return (
          <QCModal
            part={part}
            fromStage={qcModal.fromStage}
            toStage={qcModal.toStage}
            mode={qcModal.mode}
            partLabel={getPartId(part, projects, subprojects)}
            onCancel={()=>setQcModal(null)}
            onConfirm={(results)=>{
              if(qcModal.mode==="finalize") doFinalize(qcModal.partId, results);
              else                          doAdvance(qcModal.partId, results);
              setQcModal(null);
            }}
          />
        );
      })()}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <h1 style={{marginBottom:0}}>Workshop</h1>
        <button className="btn btn-primary" onClick={()=>setScanning(true)}
          style={{gap:7,fontSize:13,padding:"8px 16px"}}>
          <span style={{fontSize:17,lineHeight:1}}>△</span> Find part
        </button>
      </div>

      {okParts.length===0 && (
        <div className="alert alert-warn">No parts yet — they'll appear here as soon as the designer creates them.</div>
      )}

      {okParts.length>0 && (<>
        {/* Project / subproject filter */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
          <label className="label" style={{margin:0,whiteSpace:"nowrap"}}>Project</label>
          <select className="sel" value={projFilter}
            onChange={e=>{setProjFilter(e.target.value);setStageFilter("all");}} style={{maxWidth:380}}>
            <option value="all">All projects ({okParts.length} parts)</option>
            {activeProjects.map(p=>{
              const projCount = okParts.filter(pt=>pt.projectId===p.id).length;
              const projSubs  = subprojects.filter(s=>s.projectId===p.id);
              const optionForProject = (
                <option key={p.id} value={`proj:${p.id}`}>
                  [{p.projectCode}] {p.name} — {projCount} part{projCount!==1?"s":""}
                </option>
              );
              const optionsForSubs = projSubs.map(s=>{
                const subCount = okParts.filter(pt=>pt.subprojectId===s.id).length;
                if(subCount===0) return null;
                return (
                  <option key={s.id} value={`sub:${s.id}`}>
                    {"\u00A0\u00A0\u00A0\u00A0↳ "}[{p.projectCode}-{s.subCode}] {s.name} — {subCount} part{subCount!==1?"s":""}
                  </option>
                );
              }).filter(Boolean);
              return [optionForProject, ...optionsForSubs];
            })}
          </select>
        </div>
        {/* Stage filter */}
        <div className="filter-bar">
          {[
            ["all",  `All (${projFiltered.length})`],
            ["none", `Not started (${projFiltered.filter(p=>!p.stageId).length})`],
            ...sorted.map(s=>[s.id,`${s.name} (${projFiltered.filter(p=>p.stageId===s.id).length})`]),
          ].map(([id,label])=>(
            <button key={id} className={`btn btn-sm ${stageFilter===id?"btn-primary":"btn-ghost"}`}
              onClick={()=>setStageFilter(id)}>{label}</button>
          ))}
        </div>
      </>)}

      {filtered.length===0 && okParts.length>0 && <div className="empty">No parts match this filter.</div>}

      <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {filtered.map(part=>{
        const si      = sorted.findIndex(s=>s.id===part.stageId);
        const stage   = sorted[si];
        const prevSt  = si>0 ? sorted[si-1] : null;
        const nextSt  = !part.stageId ? sorted[0] : (si>=0&&si<sorted.length-1?sorted[si+1]:null);
        const isLast  = part.stageId===lastId;
        const isComplete   = isCompletePart(part);
        const isAwaitFinal = isAwaitingFinalQc(part);
        const isExp    = !!expanded[part.id];
        const isFound  = foundId===part.id;
        const isOnHold = !part.okToManufacture; // was once approved but designer un-ticked it
        const isDeleted= !!part.deletedByDesigner;

        // Background priority: deleted > found > on-hold > default
        const bg = isDeleted ? "#FCE8E6"
                 : isFound   ? "#FFF8F2"
                 : isOnHold  ? "#F7F6F3"
                 : "#fff";
        const outline = isFound ? "2.5px solid var(--accent)"
                      : isDeleted ? "2px solid #E5908F"
                      : "2.5px solid transparent";

        return (
          <div key={part.id}
            ref={el=>cardRefs.current[part.id]=el}
            className="ws-card"
            style={{
              margin:0,
              outline,
              transition:"outline .25s, background .2s",
              background: bg,
              opacity: isDeleted ? 0.95 : isOnHold ? 0.72 : 1,
            }}>

            {/* Compact header */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <span className="ws-id" style={{fontSize:14,
                  color: isDeleted ? "var(--danger)" : isOnHold ? "var(--ink3)" : "var(--accent)",
                  textDecoration: isDeleted ? "line-through" : "none"}}>
                  {getPartId(part,projects,subprojects)}
                </span>
                {isDeleted && (
                  <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",
                    borderRadius:20,fontSize:10,fontWeight:700,
                    background:"#FFD9D6",color:"#9B2C28",border:"1px solid #E5908F",
                    letterSpacing:".04em",textTransform:"uppercase"}}>
                    🗑 Deletion requested
                  </span>
                )}
                {!isDeleted && isOnHold && (
                  <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",
                    borderRadius:20,fontSize:10,fontWeight:600,
                    background:"#F0EDE6",color:"var(--ink3)",border:"1px solid var(--paper3)",
                    letterSpacing:".04em",textTransform:"uppercase"}}>
                    ⏸ On hold
                  </span>
                )}
              </div>
              {isDeleted ? null
                : isOnHold ? null
                : isComplete
                  ? <span className="badge badge-green">✓ Complete</span>
                  : isAwaitFinal
                    ? <span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"3px 9px",
                        borderRadius:20,fontSize:11,fontWeight:600,
                        background:"#FDF3E3",color:"#7A5A10",border:"1px solid #F0C040"}}>
                        🏁 Awaiting final QC
                      </span>
                    : <span className="stage-pill">
                        <span className="dot" style={{background:stage?stageColor(stage):"#ccc"}} />
                        {stage?stage.name:"Not started"}
                      </span>}
            </div>

            {/* Progress track */}
            <div style={{display:"flex",gap:2,marginBottom:10}}>
              {sorted.map((s,i)=>(
                <div key={s.id} title={s.name} style={{
                  flex:1,height:5,borderRadius:3,
                  background: i<=si
                    ? (isDeleted ? "#E5908F" : isOnHold ? "#BDBDBD" : isAwaitFinal && i===sorted.length-1 ? "#F0C040" : stageColor(s))
                    : "var(--paper3)",
                  transition:"background .3s"
                }} />
              ))}
            </div>

            {/* Action bar */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6,flexWrap:"wrap"}}>
              <button className="btn btn-ghost btn-sm" style={{fontSize:11,padding:"3px 9px"}}
                onClick={()=>toggleExpand(part.id)}>
                {isExp?"▲ Close":"▼ Detail"}
              </button>
              {isDeleted ? (
                confirmRemoveId===part.id ? (
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:11,color:"var(--danger)",fontWeight:500}}>Permanently delete?</span>
                    <button className="btn btn-danger btn-sm" onClick={()=>permanentlyRemove(part.id)}>Yes, remove</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setConfirmRemoveId(null)}>Cancel</button>
                  </div>
                ) : (
                  <div style={{display:"flex",gap:6}}>
                    <button className="btn btn-ghost btn-sm" style={{fontSize:11}} onClick={()=>restorePart(part.id)} title="Restore (un-delete)">↩ Restore</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>setConfirmRemoveId(part.id)}>🗑 Remove permanently</button>
                  </div>
                )
              ) : isOnHold ? (
                <span style={{fontSize:11,color:"var(--ink3)",fontStyle:"italic"}}>Awaiting designer approval</span>
              ) : isComplete ? (
                <span style={{fontSize:11,color:"var(--success)",fontWeight:500}}>Finalised ✓</span>
              ) : isAwaitFinal ? (
                <button className="btn btn-primary btn-sm" onClick={()=>finalize(part.id)} style={{background:"#F0C040",borderColor:"#D4A92E"}}>
                  🏁 Finalize
                </button>
              ) : nextSt ? (
                <button className="btn btn-primary btn-sm" onClick={()=>advance(part.id)}>▶ {nextSt.name}</button>
              ) : null}
            </div>

            {/* Expanded detail */}
            {isExp && (
              <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid var(--paper2)"}}>

                {/* Deletion-requested notice */}
                {isDeleted && (
                  <div style={{background:"#FCE8E6",border:"1px solid #E5908F",borderLeft:"4px solid var(--danger)",
                    borderRadius:6,padding:"10px 12px",marginBottom:12,fontSize:12,color:"#9B2C28",lineHeight:1.55}}>
                    <strong>🗑 Marked for deletion by the designer</strong>
                    {part.deletedByDesignerAt && (
                      <span style={{color:"var(--ink3)",fontWeight:400}}> · {new Date(part.deletedByDesignerAt).toLocaleString("en-GB")}</span>
                    )}
                    <div style={{marginTop:4,color:"#7A1F1C",fontSize:11}}>
                      As workshop manager, review the part details, then either <strong>↩ Restore</strong> the part back to active production, or <strong>🗑 Remove permanently</strong> to delete it from the system (including its 3D file).
                    </div>
                  </div>
                )}

                {/* On-hold notice */}
                {!isDeleted && isOnHold && (
                  <div style={{background:"#FDF3E3",border:"1px solid #F0C040",borderRadius:6,
                    padding:"8px 12px",marginBottom:12,fontSize:12,color:"#7A5A10",
                    display:"flex",alignItems:"center",gap:8}}>
                    ⚠ This part has been put on hold by the designer. Stage cannot be changed until re-approved.
                  </div>
                )}

                {/* Awaiting-final-QC notice */}
                {!isDeleted && !isOnHold && isAwaitFinal && (
                  <div style={{background:"#FDF3E3",border:"1px solid #F0C040",borderLeft:"4px solid #D4A92E",
                    borderRadius:6,padding:"10px 12px",marginBottom:12,fontSize:12,color:"#7A5A10",lineHeight:1.55}}>
                    <strong>🏁 Ready for final quality control</strong>
                    <div style={{marginTop:4,color:"#5A4408",fontSize:11}}>
                      The part has reached the last stage but is not yet marked Complete. Click the <strong>🏁 Finalize</strong> button to run the final QC checks and complete this part.
                    </div>
                  </div>
                )}

                {/* Marker + info side-by-side */}
                <div style={{display:"flex",gap:16,marginBottom:12,alignItems:"flex-start",flexWrap:"wrap"}}>
                  <div style={{flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",gap:6,
                    padding:"10px 14px",background:"var(--paper)",borderRadius:8,border:"1px solid var(--paper3)",minWidth:160}}>
                    {part.markerCode ? (
                      <>
                        <MarkerSVG code={part.markerCode} size={140} strokePx={2} />
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:14,letterSpacing:".15em",
                          color:isOnHold?"var(--ink3)":"var(--accent)",fontWeight:700}}>
                          {part.markerCode}
                        </span>
                        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"var(--ink3)"}}>
                          {getPartId(part,projects,subprojects)}
                        </span>
                        <button className="btn btn-ghost btn-sm" style={{fontSize:10,padding:"3px 8px",marginTop:2}}
                          onClick={()=>downloadMarkerSVG(part.markerCode, getPartId(part,projects,subprojects))}>
                          ⤓ Download SVG
                        </button>
                      </>
                    ) : (
                      <span style={{fontSize:11,color:"var(--ink3)",fontStyle:"italic"}}>No marker assigned</span>
                    )}
                  </div>

                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 14px",flex:1,fontSize:13}}>
                    <div><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",display:"block",marginBottom:2}}>Description</span>{part.description||<span style={{color:"var(--ink3)"}}>—</span>}</div>
                    <div><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",display:"block",marginBottom:2}}>Type</span>{part.type||<span style={{color:"var(--ink3)"}}>—</span>}</div>
                    <div><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",display:"block",marginBottom:2}}>Dimensions</span>
                      <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>
                        {(part.length||part.width||part.height)?`${part.length||"—"} × ${part.width||"—"} × ${part.height||"—"} mm`:"—"}
                      </span>
                    </div>
                    {(() => {
                      const w = getPartWeight(part, materials);
                      return (
                        <div><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",display:"block",marginBottom:2}}>Weight</span>
                          {w!==null
                            ? <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"var(--accent)",fontWeight:700}}>{formatWeight(w)}</span>
                            : <span style={{color:"var(--ink3)"}}>—</span>}
                        </div>
                      );
                    })()}
                    <div><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",display:"block",marginBottom:2}}>Material</span>{materialName(part.materialId,materials)||<span style={{color:"var(--ink3)"}}>—</span>}</div>
                    <div><span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",display:"block",marginBottom:2}}>Project</span>{projName(part.projectId)}</div>
                  </div>
                </div>

                {part.notes && (
                  <div style={{marginBottom:10,padding:"8px 10px",background:"#FDF6E9",
                    border:"1px solid #E8D5A6",borderLeft:"4px solid var(--accent)",borderRadius:6}}>
                    <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",
                      color:"#8B6914",marginBottom:3,fontWeight:600}}>
                      📝 Designer note
                    </div>
                    <div style={{fontSize:13,color:"var(--ink)",lineHeight:1.5}}>{part.notes}</div>
                  </div>
                )}

                {/* 3D viewer */}
                {part.stpFile && (
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",marginBottom:6}}>
                      📦 3D model
                    </div>
                    <STPViewer partId={part.id} fileName={part.stpFile.name} fileSize={part.stpFile.size} />
                  </div>
                )}

                {/* QC sign-offs */}
                {(part.qcResults||[]).length>0 && (
                  <div style={{marginBottom:10}}>
                    <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",marginBottom:6}}>
                      🛡 Quality control sign-offs
                    </div>
                    {part.qcResults.map((entry,i)=>(
                      <div key={i} style={{marginBottom:6,padding:"7px 10px",
                        background:"#F1F8F2",border:"1px solid #C8E5CC",borderRadius:6}}>
                        <div style={{fontSize:11,fontWeight:500,color:"#2D6A35",marginBottom:4,
                          display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <span>✓ {entry.stageName}</span>
                          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"var(--ink3)",fontWeight:400}}>
                            {new Date(entry.date).toLocaleDateString("en-GB")}
                          </span>
                        </div>
                        {(entry.checks||[]).map((c,j)=>(
                          <div key={j} style={{fontSize:11,color:"var(--ink3)",paddingLeft:14,marginTop:2}}>
                            <span style={{color:"#2D6A35"}}>{c.type==="tick"?"☑":"📝"}</span> {c.prompt}
                            {c.type==="note" && <span style={{color:"var(--ink2)",fontStyle:"italic"}}>: "{c.value}"</span>}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                )}

                {/* Comments */}
                <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:".05em",color:"var(--ink3)",marginBottom:6}}>Comments</div>
                {(part.comments||[]).length===0 && <div style={{fontSize:11,color:"var(--ink3)",marginBottom:8}}>No comments yet.</div>}
                {(part.comments||[]).length>0 && (
                  <div style={{marginBottom:8,background:"var(--paper)",borderRadius:6,padding:"6px 8px"}}>
                    {part.comments.map((c,i)=>(
                      <div key={i} style={{fontSize:11,color:"var(--ink3)",padding:"3px 0",borderBottom:"1px solid var(--paper2)"}}>
                        <span style={{color:"var(--accent)",fontFamily:"'JetBrains Mono',monospace"}}>{new Date(c.date).toLocaleDateString("en-GB")}</span> — {c.text}
                      </div>
                    ))}
                  </div>
                )}

                {/* Add comment — always available */}
                <div style={{display:"flex",gap:6,marginBottom:10}}>
                  <input className="note-in" placeholder="Add a comment…"
                    value={noteText[part.id]||""} style={{flex:1}}
                    onChange={e=>setNoteText(n=>({...n,[part.id]:e.target.value}))}
                    onKeyDown={e=>e.key==="Enter"&&saveNote(part.id)} />
                  <button className="btn btn-ghost btn-sm" onClick={()=>saveNote(part.id)}>Save</button>
                </div>

                {/* Back-stage — locked when on hold or deletion-requested */}
                {!isOnHold && !isDeleted && (
                  <button className="btn btn-ghost btn-sm" style={{fontSize:11}}
                    onClick={()=>goBack(part.id)} disabled={!part.stageId}>
                    ◀ Back to {prevSt?prevSt.name:"start"}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      })}
      </div>
    </div>
  );
}

// ── Color palette & picker ────────────────────────────────────────────────────
const PALETTE = [
  // ← Red      Orange     Yellow     Lime       Green      Teal       Blue       Purple  →  (light → dark ↓)
  ["#FFEBEE","#FFF3E0","#FFFDE7","#F9FBE7","#E8F5E9","#E0F2F1","#E3F2FD","#F3E5F5"],
  ["#FFCDD2","#FFE0B2","#FFF9C4","#F0F4C3","#C8E6C9","#B2DFDB","#BBDEFB","#E1BEE7"],
  ["#EF9A9A","#FFCC80","#FFF176","#E6EE9C","#A5D6A7","#80CBC4","#90CAF9","#CE93D8"],
  ["#E57373","#FFB74D","#FFEE58","#D4E157","#66BB6A","#4DB6AC","#64B5F6","#BA68C8"],
  ["#EF5350","#FFA726","#FFCA28","#C0CA33","#43A047","#26A69A","#42A5F5","#AB47BC"],
  ["#F44336","#FF9800","#FFC107","#AFB42B","#2E7D32","#00897B","#1E88E5","#8E24AA"],
  ["#D32F2F","#F57C00","#FF8F00","#9E9D24","#1B5E20","#004D40","#1565C0","#6A1B9A"],
  ["#B71C1C","#E65100","#FF6F00","#827717","#194D33","#00251A","#0D47A1","#4A148C"],
];
const NEUTRALS = ["#FFFFFF","#F5F5F5","#E0E0E0","#BDBDBD","#9E9E9E","#616161","#424242","#212121"];

function ColorPicker({ value, onChange }){
  const [open, setOpen] = useState(false);
  const wrap = React.useRef(null);

  useEffect(()=>{
    if(!open) return;
    const close = e=>{ if(wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return ()=>document.removeEventListener("mousedown", close);
  },[open]);

  return (
    <div ref={wrap} style={{position:"relative",flexShrink:0}}>
      {/* Swatch trigger */}
      <div onClick={()=>setOpen(v=>!v)}
        title="Pick colour"
        style={{
          width:26, height:26, borderRadius:5, background:value,
          border: open ? "2px solid var(--accent)" : "2px solid rgba(0,0,0,.18)",
          cursor:"pointer", transition:"box-shadow .15s",
          boxShadow: open ? "0 0 0 3px rgba(212,88,10,.25)" : "none",
        }} />

      {/* Popover grid */}
      {open && (
        <div style={{
          position:"absolute", top:32, left:0, zIndex:600,
          background:"#fff", border:"1px solid var(--paper3)", borderRadius:10,
          padding:10, boxShadow:"0 6px 24px rgba(0,0,0,.16)",
          width:"auto",
        }}>
          {/* 8×8 hue grid */}
          <div style={{display:"grid", gridTemplateColumns:"repeat(8,22px)", gap:3, marginBottom:6}}>
            {PALETTE.flat().map((c,idx)=>(
              <div key={idx} onClick={()=>{ onChange(c); setOpen(false); }}
                title={c}
                style={{
                  width:22, height:22, borderRadius:4, background:c, cursor:"pointer",
                  border: c.toLowerCase()===value.toLowerCase()
                    ? "2px solid var(--accent)"
                    : "2px solid rgba(0,0,0,.08)",
                  transition:"transform .1s, box-shadow .1s",
                }}
                onMouseEnter={e=>{ e.currentTarget.style.transform="scale(1.25)"; e.currentTarget.style.zIndex=10; e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,.22)"; }}
                onMouseLeave={e=>{ e.currentTarget.style.transform="scale(1)";    e.currentTarget.style.zIndex=0;  e.currentTarget.style.boxShadow="none"; }}
              />
            ))}
          </div>

          {/* Neutral strip */}
          <div style={{borderTop:"1px solid var(--paper3)", paddingTop:6,
            display:"grid", gridTemplateColumns:"repeat(8,22px)", gap:3}}>
            {NEUTRALS.map((c,idx)=>(
              <div key={idx} onClick={()=>{ onChange(c); setOpen(false); }}
                title={c}
                style={{
                  width:22, height:22, borderRadius:4, background:c, cursor:"pointer",
                  border: c.toLowerCase()===value.toLowerCase()
                    ? "2px solid var(--accent)"
                    : "2px solid rgba(0,0,0,.08)",
                  transition:"transform .1s, box-shadow .1s",
                }}
                onMouseEnter={e=>{ e.currentTarget.style.transform="scale(1.25)"; e.currentTarget.style.zIndex=10; e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,.22)"; }}
                onMouseLeave={e=>{ e.currentTarget.style.transform="scale(1)";    e.currentTarget.style.zIndex=0;  e.currentTarget.style.boxShadow="none"; }}
              />
            ))}
          </div>

          {/* Current hex display */}
          <div style={{marginTop:8, fontSize:11, fontFamily:"'JetBrains Mono',monospace",
            color:"var(--ink3)", textAlign:"center", letterSpacing:".06em"}}>
            {value.toUpperCase()}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Settings ──────────────────────────────────────────────────────────────────
function SettingsPage({ stages, setStages, partTypes, setPartTypes, subprojects, setSubprojects, materials, setMaterials }){
  const [newStage,   setNewStage]   = useState("");
  const [editStId,   setEditStId]   = useState(null);
  const [editStVal,  setEditStVal]  = useState("");
  const [newType,    setNewType]    = useState({name:"",code:""});
  const [editTypeIdx,setEditTypeIdx]= useState(null);
  const [editTypeVal,setEditTypeVal]= useState({name:"",code:""});
  // QC state
  const [qcOpen,    setQcOpen]    = useState(null);  // stage id whose QC panel is open
  const [newQc,     setNewQc]     = useState({type:"tick", prompt:""});
  const [editQc,    setEditQc]    = useState(null);  // {stageId, qcId}
  const [editQcVal, setEditQcVal] = useState({type:"tick", prompt:""});
  // Materials state
  const [newMat,    setNewMat]    = useState({name:"",density:""});
  const [editMatId, setEditMatId] = useState(null);
  const [editMatVal,setEditMatVal]= useState({name:"",density:""});

  const sorted = [...stages].sort((a,b)=>a.order-b.order);

  // ── stages ──
  function addStage(){
    if(!newStage.trim()) return;
    const maxOrd=sorted.length?sorted[sorted.length-1].order+1:0;
    setStages(prev=>[...prev,{id:uid(),name:newStage.trim(),order:maxOrd,color:"#8B7355",qcChecks:[]}]);
    setNewStage("");
  }
  function delStage(id){ if(sorted.length>1) setStages(prev=>prev.filter(s=>s.id!==id)); }
  function moveStage(id,dir){
    const i=sorted.findIndex(s=>s.id===id), j=i+dir;
    if(j<0||j>=sorted.length) return;
    setStages(prev=>prev.map(s=>{
      if(s.id===sorted[i].id) return{...s,order:sorted[j].order};
      if(s.id===sorted[j].id) return{...s,order:sorted[i].order};
      return s;
    }));
  }
  function saveStage(id){
    if(!editStVal.trim()) return;
    setStages(prev=>prev.map(s=>s.id===id?{...s,name:editStVal.trim()}:s));
    setEditStId(null);
  }
  function setStageColor(id,color){
    setStages(prev=>prev.map(s=>s.id===id?{...s,color}:s));
  }

  // ── quality control checks ──
  function addQc(stageId){
    const prompt=newQc.prompt.trim();
    if(!prompt) return;
    setStages(prev=>prev.map(s=>s.id===stageId
      ? {...s, qcChecks:[...(s.qcChecks||[]), {id:uid(), type:newQc.type, prompt}]}
      : s));
    setNewQc({type:"tick", prompt:""});
  }
  function delQc(stageId, qcId){
    setStages(prev=>prev.map(s=>s.id===stageId
      ? {...s, qcChecks:(s.qcChecks||[]).filter(q=>q.id!==qcId)}
      : s));
  }
  function saveQc(){
    if(!editQc) return;
    const prompt=editQcVal.prompt.trim();
    if(!prompt) return;
    setStages(prev=>prev.map(s=>s.id===editQc.stageId
      ? {...s, qcChecks:(s.qcChecks||[]).map(q=>q.id===editQc.qcId?{...q,type:editQcVal.type,prompt}:q)}
      : s));
    setEditQc(null);
  }

  // ── part types ──
  function addType(){
    const name=newType.name.trim(), code=newType.code.trim().toUpperCase();
    if(!name||!code) return;
    if(partTypes.some(t=>t.name===name||t.code===code)) return;
    setPartTypes(prev=>[...prev,{name,code}]);
    setNewType({name:"",code:""});
  }
  function delType(i){ setPartTypes(prev=>prev.filter((_,idx)=>idx!==i)); }
  function saveType(i){
    const name=editTypeVal.name.trim(), code=editTypeVal.code.trim().toUpperCase();
    if(!name||!code) return;
    setPartTypes(prev=>prev.map((v,idx)=>idx===i?{name,code}:v));
    setEditTypeIdx(null);
  }

  // ── materials ──
  function addMaterial(){
    const name = newMat.name.trim();
    const dens = parseFloat(newMat.density);
    if(!name || !dens || dens<=0) return;
    if(materials.some(m=>m.name===name)) return;
    setMaterials(prev=>[...prev,{id:uid(),name,density:dens}]);
    setNewMat({name:"",density:""});
  }
  function delMaterial(id){ setMaterials(prev=>prev.filter(m=>m.id!==id)); }
  function saveMaterial(id){
    const name = editMatVal.name.trim();
    const dens = parseFloat(editMatVal.density);
    if(!name || !dens || dens<=0) return;
    setMaterials(prev=>prev.map(m=>m.id===id?{...m,name,density:dens}:m));
    setEditMatId(null);
  }

  // ── export / import ──
  function exportData(){
    const data={
      exportedAt:new Date().toISOString(),
      stages:JSON.parse(localStorage.getItem("pt:stages")||"[]"),
      projects:JSON.parse(localStorage.getItem("pt:projects")||"[]"),
      subprojects:JSON.parse(localStorage.getItem("pt:subprojects")||"[]"),
      parts:JSON.parse(localStorage.getItem("pt:parts")||"[]"),
      partTypes:JSON.parse(localStorage.getItem("pt:partTypes")||"[]"),
      materials:JSON.parse(localStorage.getItem("pt:materials")||"[]"),
      markerSeq:JSON.parse(localStorage.getItem("pt:markerSeq")||"1"),
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`pierretrace-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }
  function importData(e){
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.stages){localStorage.setItem("pt:stages",JSON.stringify(d.stages));setStages(d.stages);}
        if(d.projects)localStorage.setItem("pt:projects",JSON.stringify(d.projects));
        if(d.subprojects){localStorage.setItem("pt:subprojects",JSON.stringify(d.subprojects));setSubprojects(d.subprojects);}
        if(d.parts)localStorage.setItem("pt:parts",JSON.stringify(d.parts));
        if(d.partTypes){localStorage.setItem("pt:partTypes",JSON.stringify(d.partTypes));setPartTypes(d.partTypes);}
        if(d.materials){localStorage.setItem("pt:materials",JSON.stringify(d.materials));setMaterials(d.materials);}
        if(d.markerSeq){localStorage.setItem("pt:markerSeq",JSON.stringify(d.markerSeq));}
        alert("Import successful — please refresh the page.");
      }catch{alert("Could not read file.");}
    };
    r.readAsText(file);
  }

  return (
    <div>
      <h1>Settings</h1>

      {/* ── Production stages ── */}
      <div className="card" style={{maxWidth:600}}>
        <h3>Production stages</h3>
        <p style={{fontSize:12,color:"var(--ink3)",lineHeight:1.7,marginBottom:16}}>
          Define each stage a part moves through. Click the colour swatch to set a colour, or "QC" to define quality-control checks that must pass before a part can advance out of that stage.
        </p>
        <ul style={{listStyle:"none"}}>
          {sorted.map((s,i)=>{
            const checks = s.qcChecks || [];
            const isQc   = qcOpen === s.id;
            return (
              <li key={s.id} style={{marginBottom:6}}>
                <div className="stage-li" style={{marginBottom:0}}>
                  <span className="stage-num">#{i+1}</span>
                  <ColorPicker value={stageColor(s)} onChange={color=>setStageColor(s.id,color)} />
                  {editStId===s.id ? (
                    <>
                      <input className="input" value={editStVal} autoFocus style={{flex:1}}
                        onChange={e=>setEditStVal(e.target.value)}
                        onKeyDown={e=>{if(e.key==="Enter")saveStage(s.id);if(e.key==="Escape")setEditStId(null);}} />
                      <button className="btn btn-success btn-sm" onClick={()=>saveStage(s.id)}>Save</button>
                      <button className="btn btn-ghost btn-sm"   onClick={()=>setEditStId(null)}>Cancel</button>
                    </>
                  ):(
                    <>
                      <span style={{flex:1,fontWeight:500,fontSize:13}}>{s.name}</span>
                      <button className="btn btn-ghost btn-sm" title="Quality control checks"
                        onClick={()=>setQcOpen(o=>o===s.id?null:s.id)}
                        style={{padding:"4px 8px",fontSize:11,
                          background:isQc?"var(--paper3)":undefined}}>
                        QC{checks.length>0?` (${checks.length})`:""} {isQc?"▲":"▼"}
                      </button>
                      <button className="btn btn-ghost btn-icon" title="Rename" onClick={()=>{setEditStId(s.id);setEditStVal(s.name);}}>✏</button>
                      <button className="btn btn-ghost btn-icon" title="Move up"   onClick={()=>moveStage(s.id,-1)} disabled={i===0}>↑</button>
                      <button className="btn btn-ghost btn-icon" title="Move down" onClick={()=>moveStage(s.id,1)}  disabled={i===sorted.length-1}>↓</button>
                      <button className="btn btn-danger btn-icon btn-sm" title="Delete" onClick={()=>delStage(s.id)} disabled={sorted.length<=1}>✕</button>
                    </>
                  )}
                </div>

                {/* QC panel */}
                {isQc && (
                  <div style={{
                    marginTop:4, marginLeft:36, padding:"10px 12px",
                    background:"var(--paper)", border:"1px solid var(--paper3)",
                    borderRadius:"var(--r)", borderLeft:`3px solid ${stageColor(s)}`,
                  }}>
                    <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:".06em",
                      color:"var(--ink3)",marginBottom:8,fontWeight:500}}>
                      Quality control — {s.name}
                    </div>

                    {checks.length===0 && (
                      <div style={{fontSize:12,color:"var(--ink3)",fontStyle:"italic",marginBottom:8}}>
                        No QC checks yet. A part will advance freely from this stage.
                      </div>
                    )}

                    {checks.length>0 && (
                      <ul style={{listStyle:"none",marginBottom:10}}>
                        {checks.map(qc=>{
                          const isEditing = editQc?.qcId===qc.id;
                          return (
                            <li key={qc.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid var(--paper2)"}}>
                              {isEditing ? (
                                <>
                                  <select className="sel" value={editQcVal.type}
                                    onChange={e=>setEditQcVal(v=>({...v,type:e.target.value}))}
                                    style={{width:88,padding:"5px 8px",fontSize:12}}>
                                    <option value="tick">☐ Tick</option>
                                    <option value="note">📝 Note</option>
                                  </select>
                                  <input className="input" value={editQcVal.prompt} autoFocus style={{flex:1,padding:"5px 8px",fontSize:12}}
                                    onChange={e=>setEditQcVal(v=>({...v,prompt:e.target.value}))}
                                    onKeyDown={e=>{if(e.key==="Enter")saveQc();if(e.key==="Escape")setEditQc(null);}} />
                                  <button className="btn btn-success btn-sm" onClick={saveQc}>Save</button>
                                  <button className="btn btn-ghost btn-sm" onClick={()=>setEditQc(null)}>Cancel</button>
                                </>
                              ) : (
                                <>
                                  <span style={{
                                    fontSize:10,padding:"2px 7px",borderRadius:4,fontWeight:600,letterSpacing:".04em",
                                    textTransform:"uppercase",
                                    background:qc.type==="tick"?"#D4E8F8":"#F0E4D7",
                                    color:qc.type==="tick"?"#1A5A8A":"#7A5A10",
                                  }}>{qc.type==="tick"?"☐ Tick":"📝 Note"}</span>
                                  <span style={{flex:1,fontSize:13,color:"var(--ink)"}}>{qc.prompt}</span>
                                  <button className="btn btn-ghost btn-icon" title="Edit"
                                    onClick={()=>{setEditQc({stageId:s.id,qcId:qc.id});setEditQcVal({type:qc.type,prompt:qc.prompt});}}>✏</button>
                                  <button className="btn btn-danger btn-icon btn-sm" title="Delete"
                                    onClick={()=>delQc(s.id,qc.id)}>✕</button>
                                </>
                              )}
                            </li>
                          );
                        })}
                      </ul>
                    )}

                    {/* Add new QC */}
                    <div style={{display:"flex",gap:6,alignItems:"flex-end",flexWrap:"wrap"}}>
                      <div style={{width:96}}>
                        <label className="label" style={{fontSize:9}}>Type</label>
                        <select className="sel" value={newQc.type}
                          onChange={e=>setNewQc(v=>({...v,type:e.target.value}))}
                          style={{padding:"6px 8px",fontSize:12}}>
                          <option value="tick">☐ Tick</option>
                          <option value="note">📝 Note</option>
                        </select>
                      </div>
                      <div style={{flex:1,minWidth:140}}>
                        <label className="label" style={{fontSize:9}}>Prompt message</label>
                        <input className="input" value={newQc.prompt} placeholder="e.g. All edges deburred"
                          onChange={e=>setNewQc(v=>({...v,prompt:e.target.value}))}
                          onKeyDown={e=>e.key==="Enter"&&addQc(s.id)}
                          style={{padding:"6px 8px",fontSize:12}} />
                      </div>
                      <button className="btn btn-primary btn-sm" onClick={()=>addQc(s.id)}>+ Add check</button>
                    </div>
                  </div>
                )}
              </li>
            );
          })}
        </ul>
        <div className="row" style={{marginTop:12}}>
          <div className="field">
            <input className="input" placeholder="New stage name (e.g. Quality check)"
              value={newStage} onChange={e=>setNewStage(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&addStage()} />
          </div>
          <button className="btn btn-primary" onClick={addStage}>+ Add</button>
        </div>
      </div>

      {/* ── Part types ── */}
      <div className="card" style={{maxWidth:600}}>
        <h3>Part types</h3>
        <p style={{fontSize:12,color:"var(--ink3)",lineHeight:1.7,marginBottom:16}}>
          Each type has a display <strong>Name</strong> (shown in the dropdown) and a short <strong>Code</strong> (appended to the part ID with no dash). e.g. selecting "Tread [T]" on part <span style={{fontFamily:"monospace"}}>GD-3S</span> produces <span style={{fontFamily:"monospace"}}>GD-3ST</span>.
        </p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 80px",gap:4,paddingBottom:6,
          borderBottom:"1px solid var(--paper3)",marginBottom:8}}>
          <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".06em",color:"var(--ink3)",paddingLeft:12}}>Name</span>
          <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".06em",color:"var(--ink3)"}}>Code</span>
        </div>
        <ul style={{listStyle:"none"}}>
          {partTypes.map((t,i)=>(
            <li key={i} className="stage-li">
              {editTypeIdx===i ? (
                <>
                  <input className="input" value={editTypeVal.name} autoFocus style={{flex:1}}
                    placeholder="Name"
                    onChange={e=>setEditTypeVal(v=>({...v,name:e.target.value}))}
                    onKeyDown={e=>{if(e.key==="Enter")saveType(i);if(e.key==="Escape")setEditTypeIdx(null);}} />
                  <input className="input" value={editTypeVal.code} style={{width:70,fontFamily:"'JetBrains Mono',monospace"}}
                    placeholder="Code"
                    onChange={e=>setEditTypeVal(v=>({...v,code:e.target.value.toUpperCase()}))}
                    onKeyDown={e=>{if(e.key==="Enter")saveType(i);if(e.key==="Escape")setEditTypeIdx(null);}} />
                  <button className="btn btn-success btn-sm" onClick={()=>saveType(i)}>Save</button>
                  <button className="btn btn-ghost btn-sm"   onClick={()=>setEditTypeIdx(null)}>Cancel</button>
                </>
              ):(
                <>
                  <span style={{flex:1,fontWeight:500,fontSize:13}}>{t.name}</span>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,background:"var(--paper2)",
                    padding:"2px 7px",borderRadius:4,color:"var(--accent)",fontWeight:700,minWidth:36,
                    textAlign:"center"}}>{t.code}</span>
                  <button className="btn btn-ghost btn-icon" title="Edit"
                    onClick={()=>{setEditTypeIdx(i);setEditTypeVal({name:t.name,code:t.code});}}>✏</button>
                  <button className="btn btn-danger btn-icon btn-sm" title="Delete" onClick={()=>delType(i)}>✕</button>
                </>
              )}
            </li>
          ))}
        </ul>
        <div style={{display:"flex",gap:8,marginTop:12,alignItems:"flex-end"}}>
          <div className="field">
            <label className="label">Name</label>
            <input className="input" placeholder="e.g. Corbel"
              value={newType.name} onChange={e=>setNewType(v=>({...v,name:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&addType()} />
          </div>
          <div style={{width:80}}>
            <label className="label">Code</label>
            <input className="input" placeholder="e.g. C"
              value={newType.code} onChange={e=>setNewType(v=>({...v,code:e.target.value.toUpperCase()}))}
              style={{fontFamily:"'JetBrains Mono',monospace"}}
              onKeyDown={e=>e.key==="Enter"&&addType()} />
          </div>
          <button className="btn btn-primary" onClick={addType} style={{flexShrink:0}}>+ Add</button>
        </div>
      </div>

      {/* ── Materials ── */}
      <div className="card" style={{maxWidth:600}}>
        <h3>Materials</h3>
        <p style={{fontSize:12,color:"var(--ink3)",lineHeight:1.7,marginBottom:16}}>
          Each material has a <strong>Name</strong> and a <strong>Density</strong> in <span style={{fontFamily:"monospace"}}>kg/m³</span>. Density is used to auto-calculate a part's weight from its dimensions. Common stone densities: limestone ~2400, granite ~2700, marble ~2700, basalt ~3000.
        </p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 120px",gap:4,paddingBottom:6,
          borderBottom:"1px solid var(--paper3)",marginBottom:8}}>
          <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".06em",color:"var(--ink3)",paddingLeft:12}}>Name</span>
          <span style={{fontSize:10,textTransform:"uppercase",letterSpacing:".06em",color:"var(--ink3)"}}>Density (kg/m³)</span>
        </div>
        <ul style={{listStyle:"none"}}>
          {materials.map(m=>(
            <li key={m.id} className="stage-li">
              {editMatId===m.id ? (
                <>
                  <input className="input" value={editMatVal.name} autoFocus style={{flex:1}}
                    placeholder="Name"
                    onChange={e=>setEditMatVal(v=>({...v,name:e.target.value}))}
                    onKeyDown={e=>{if(e.key==="Enter")saveMaterial(m.id);if(e.key==="Escape")setEditMatId(null);}} />
                  <input className="input" value={editMatVal.density} type="number"
                    style={{width:100,fontFamily:"'JetBrains Mono',monospace"}}
                    placeholder="kg/m³"
                    onChange={e=>setEditMatVal(v=>({...v,density:e.target.value}))}
                    onKeyDown={e=>{if(e.key==="Enter")saveMaterial(m.id);if(e.key==="Escape")setEditMatId(null);}} />
                  <button className="btn btn-success btn-sm" onClick={()=>saveMaterial(m.id)}>Save</button>
                  <button className="btn btn-ghost btn-sm"   onClick={()=>setEditMatId(null)}>Cancel</button>
                </>
              ):(
                <>
                  <span style={{flex:1,fontWeight:500,fontSize:13}}>{m.name}</span>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,background:"var(--paper2)",
                    padding:"2px 9px",borderRadius:4,color:"var(--accent)",fontWeight:700,minWidth:80,
                    textAlign:"center"}}>{m.density}</span>
                  <button className="btn btn-ghost btn-icon" title="Edit"
                    onClick={()=>{setEditMatId(m.id);setEditMatVal({name:m.name,density:String(m.density)});}}>✏</button>
                  <button className="btn btn-danger btn-icon btn-sm" title="Delete" onClick={()=>delMaterial(m.id)}>✕</button>
                </>
              )}
            </li>
          ))}
        </ul>
        <div style={{display:"flex",gap:8,marginTop:12,alignItems:"flex-end"}}>
          <div className="field">
            <label className="label">Name</label>
            <input className="input" placeholder="e.g. Granite"
              value={newMat.name} onChange={e=>setNewMat(v=>({...v,name:e.target.value}))}
              onKeyDown={e=>e.key==="Enter"&&addMaterial()} />
          </div>
          <div style={{width:120}}>
            <label className="label">Density (kg/m³)</label>
            <input className="input" type="number" placeholder="e.g. 2700"
              value={newMat.density} onChange={e=>setNewMat(v=>({...v,density:e.target.value}))}
              style={{fontFamily:"'JetBrains Mono',monospace"}}
              onKeyDown={e=>e.key==="Enter"&&addMaterial()} />
          </div>
          <button className="btn btn-primary" onClick={addMaterial} style={{flexShrink:0}}>+ Add</button>
        </div>
      </div>

      {/* ── Backup ── */}
      <div className="card" style={{maxWidth:600}}>
        <h3>Data — backup &amp; restore</h3>
        <p style={{fontSize:12,color:"var(--ink3)",lineHeight:1.7,marginBottom:14}}>
          All data is saved in your browser's local storage. Export regularly as a backup or to move data to another computer.
        </p>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
          <button className="btn btn-primary" onClick={exportData}>⬇ Export data (JSON)</button>
          <label className="btn btn-ghost" style={{cursor:"pointer"}}>
            ⬆ Import data
            <input type="file" accept=".json" style={{display:"none"}} onChange={importData} />
          </label>
        </div>
        <p style={{fontSize:11,color:"var(--ink3)",marginTop:10}}>⚠ Importing will overwrite all current data. Back up first.</p>
      </div>

      <div className="card" style={{maxWidth:600}}>
        <h3>About</h3>
        <p style={{fontSize:13,color:"var(--ink2)",lineHeight:1.8}}>
          <strong>PierreTrace</strong> — parts traceability for stone staircase workshops.<br/>
          Data stored locally via localStorage. To share across computers, use Export / Import above,<br/>
          or deploy on your company server with a shared database.
        </p>
      </div>
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────────
function App(){
  const [page,         setPage]         = useState("manager");
  const [stages,       setStages]       = useState([]);
  const [projects,     setProjects]     = useState([]);
  const [subprojects,  setSubprojects]  = useState([]);
  const [parts,        setParts]        = useState([]);
  const [partTypes,    setPartTypes]    = useState([]);
  const [materials,    setMaterials]    = useState([]);
  const [markerSeq,    setMarkerSeq]    = useState(1); // next sequential counter for markerCode
  const [loaded,       setLoaded]       = useState(false);

  useEffect(()=>{
    setStages(lsGet("pt:stages")           || DEFAULT_STAGES);
    setProjects(lsGet("pt:projects")       || []);
    setSubprojects(lsGet("pt:subprojects") || []);
    setPartTypes(lsGet("pt:partTypes")     || DEFAULT_PART_TYPES);
    setMaterials(lsGet("pt:materials")     || DEFAULT_MATERIALS);

    // Load parts, then migrate any without markerCode (assign sequential codes).
    const rawParts = lsGet("pt:parts") || [];
    let seq = lsGet("pt:markerSeq") || 1;
    const usedCodes = new Set(rawParts.filter(p=>p.markerCode).map(p=>p.markerCode));
    const migrated = rawParts.map(p=>{
      if(p.markerCode) return p;
      // assign next unused code
      let code;
      do { code = markerSeqToCode(seq++); } while(usedCodes.has(code));
      usedCodes.add(code);
      return {...p, markerCode: code};
    });
    setParts(migrated);
    setMarkerSeq(seq);
    setLoaded(true);
  },[]);

  useEffect(()=>{ if(loaded) lsSet("pt:stages",      stages);      },[stages,      loaded]);
  useEffect(()=>{ if(loaded) lsSet("pt:projects",    projects);    },[projects,    loaded]);
  useEffect(()=>{ if(loaded) lsSet("pt:subprojects", subprojects); },[subprojects, loaded]);
  useEffect(()=>{ if(loaded) lsSet("pt:parts",       parts);       },[parts,       loaded]);
  useEffect(()=>{ if(loaded) lsSet("pt:partTypes",   partTypes);   },[partTypes,   loaded]);
  useEffect(()=>{ if(loaded) lsSet("pt:materials",   materials);   },[materials,   loaded]);
  useEffect(()=>{ if(loaded) lsSet("pt:markerSeq",   markerSeq);   },[markerSeq,   loaded]);

  if(!loaded) return <div style={{padding:48,textAlign:"center",color:"#888"}}>Loading…</div>;

  const base = { stages, setStages, projects, setProjects, subprojects, setSubprojects, parts, setParts, partTypes, setPartTypes, materials, setMaterials, markerSeq, setMarkerSeq };

  return (
    <div className="app">
      <nav className="topbar">
        <div className="logo">PIERRE<span>TRACE</span></div>
        <div className="nav-tabs">
          {[["manager","Manager"],["designer","Designer"],["workshop","Workshop"],["settings","Settings"]].map(([id,label])=>(
            <button key={id} className={`nav-tab${page===id?" active":""}`} onClick={()=>setPage(id)}>{label}</button>
          ))}
        </div>
      </nav>
      <main className="main">
        {page==="manager"  && <ManagerPage  {...base} />}
        {page==="designer" && <DesignerPage {...base} />}
        {page==="workshop" && <WorkshopPage {...base} />}
        {page==="settings" && <SettingsPage {...base} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
